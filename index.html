<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Sleep</title>
<meta name="description" content="A tiny sleep tracker for your little one.">
<meta name="theme-color" content="#13132a" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#fbf6f0" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sleep">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  @font-face {
    font-family: "Nunito";
    src: url(fonts/nunito.woff2) format("woff2");
    font-weight: 200 1000;
    font-display: swap;
  }
  :root {
    --bg: #fbf6f0;
    --card: #ffffff;
    --card-2: #f5ede4;
    --text: #2b2622;
    --muted: #8c8178;
    --faint: #c2b8ad;
    --line: rgba(70, 45, 20, 0.08);
    --night: #6a62e0;
    --night-2: #8e87f0;
    --nap: #ffbe3d;
    --nap-2: #ffd98a;
    --sun: #ff8a3d;
    --good: #2bb673;
    --danger: #f2545b;
    --milk: #3c9bef;
    --solid: #2bb673;
    --rail: rgba(70, 45, 20, 0.1);
    --btn: #2b2622;
    --btn-text: #ffffff;
    --shadow: 0 1px 2px rgba(70, 45, 20, 0.04), 0 8px 24px rgba(70, 45, 20, 0.06);
    --sheet-bg: #fffdfa;
    --scrim: rgba(40, 25, 10, 0.32);
    --radius: 26px;
    /* the face at the top: --ink is its lines, --mouth its open mouth */
    --fz-h: max(176px, 27vh);
    --ink: #2b2622;
    --mouth: #2b2622;
    color-scheme: light;
  }
  @supports (height: 1svh) { :root { --fz-h: max(176px, 27svh); } }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #13132a;
      --card: #1e1e3b;
      --card-2: #2a2a4d;
      --text: #f6f1ea;
      --muted: #a19dc2;
      --faint: #5e5a85;
      --line: rgba(255, 255, 255, 0.06);
      --night: #8078f0;
      --night-2: #a49ef7;
      --sun: #ff9a52;
      --milk: #5aaaf5;
      --solid: #3ccf8a;
      --rail: rgba(255, 255, 255, 0.09);
      --btn: #f6f1ea;
      --btn-text: #13132a;
      --shadow: none;
      --sheet-bg: #1e1e3b;
      --scrim: rgba(5, 5, 20, 0.6);
      --ink: #f6f1ea;
      --mouth: #f6f1ea;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  html, body { margin: 0; color: var(--text); }
  body {
    font-family: "Nunito", ui-rounded, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    min-height: 100dvh;
    overscroll-behavior-y: none;
    font-feature-settings: "tnum" 1;
  }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
  input { font: inherit; color: inherit; }

  /* ---------- Face zone (fixed behind the cards) ---------- */
  .fz {
    position: fixed; top: 0; left: 0; right: 0; height: var(--fz-h); z-index: 0;
    overflow: hidden; background: var(--bg);
  }
  .face-wrap {
    position: absolute; left: 0; right: 0; top: env(safe-area-inset-top); bottom: 28px;
    display: grid; place-items: center; will-change: transform;
  }
  /* The face drifts up and shrinks a little as the cards slide over it. This is a CSS
     scroll-driven animation, so it runs in step with scrolling instead of lagging behind it
     (a JS scroll handler made the eyes stutter on iPhone). Browsers without it keep the face still. */
  @supports (animation-timeline: scroll()) {
    .face-wrap { animation: face-drift linear both; animation-timeline: scroll(root); animation-range: 0 300px; }
    @keyframes face-drift { to { transform: translateY(-90px) scale(.8); } }
  }
  .face-hit { position: relative; height: min(142px, 86%); aspect-ratio: 148 / 98; cursor: pointer; }
  .face { width: 100%; height: 100%; overflow: visible; display: block; }

  .avatar {
    position: absolute; top: calc(env(safe-area-inset-top) + 10px); right: 16px; z-index: 2;
    width: 40px; height: 40px; border-radius: 50%;
    display: grid; place-items: center;
    font-weight: 800; font-size: 16px; color: var(--text);
    background: var(--card); box-shadow: var(--shadow);
    transition: transform .2s ease;
  }
  .avatar:active { transform: scale(0.92); }

  /* Face parts. The face is drawn frame by frame from JS (no tweening): lids are flat cuts
     across round eyes, and the mouth swaps between fixed shapes via data-mouth. */
  .face .white { fill: #fff; }
  .face .pupil { fill: #1e1b18; }
  .face .shut, .face .line { fill: none; stroke: var(--ink); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
  .face .fill { fill: var(--mouth); }
  .face .m { display: none; }
  .face[data-mouth=smile] .m-smile, .face[data-mouth=flat] .m-flat, .face[data-mouth=o] .m-o,
  .face[data-mouth=yawn1] .m-yawn1, .face[data-mouth=yawn2] .m-yawn2,
  .face[data-mouth=chew1] .m-chew1, .face[data-mouth=chew2] .m-flat,
  .face[data-mouth=sleep] .m-sleep, .face[data-mouth=sleep2] .m-sleep2 { display: inline; }

  /* The cards live on a panel that slides up over the face */
  .app {
    position: relative; z-index: 1;
    max-width: 480px;
    margin: calc(var(--fz-h) - 28px) auto 0;
    padding: 14px 16px calc(env(safe-area-inset-bottom) + 40px);
    background: var(--bg);
    border-radius: 32px 32px 0 0;
    min-height: calc(100vh - var(--fz-h) + 28px);
  }
  .app::after { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 100vh; background: var(--bg); }

  /* ---------- Hero ---------- */
  .hero {
    position: relative;
    border-radius: 28px; padding: 24px 20px 20px;
    background: var(--card); box-shadow: var(--shadow);
    text-align: center;
  }
  .status { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--nap); position: relative; }
  .sleeping .dot { background: var(--night-2); }
  .sleeping .dot::after {
    content: ""; position: absolute; inset: -4px; border-radius: 50%;
    border: 2px solid var(--night-2); opacity: 0; animation: ping 2s ease-out infinite;
  }
  @keyframes ping { 0% { transform: scale(.5); opacity: .8; } 100% { transform: scale(1.8); opacity: 0; } }
  .timer {
    font-size: clamp(48px, 18.6vw, 80px); font-weight: 900; letter-spacing: -0.02em; line-height: 1;
    margin: 18px 0 10px; font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .timer small { font-size: .45em; letter-spacing: -0.01em; color: var(--muted); font-weight: 700; }
  .timer .sec { color: var(--faint); }
  .sub { font-size: 14px; color: var(--muted); min-height: 20px; }
  .sub button { color: var(--night); font-weight: 700; }
  @media (prefers-color-scheme: dark) { .sub button { color: var(--night-2); } }

  .main-btn {
    margin-top: 20px; width: 100%; height: 58px; border-radius: 999px;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    background: var(--night); color: #fff;
    box-shadow: 0 10px 22px -12px var(--night);
    font-size: 17px; font-weight: 750; letter-spacing: -0.01em;
    transition: transform .15s ease, background .3s ease;
  }
  .main-btn:active { transform: scale(0.97); }
  .main-btn svg { width: 20px; height: 20px; }
  .sleeping .main-btn { background: var(--sun); box-shadow: 0 10px 22px -12px var(--sun); }

  /* ---------- Stat tiles ---------- */
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
  .tile { background: var(--card); border-radius: 20px; padding: 14px 14px 13px; box-shadow: var(--shadow); }
  .tile .label { font-size: 12px; color: var(--muted); font-weight: 600; }
  .tile .val { font-size: 20px; font-weight: 800; letter-spacing: -0.01em; margin-top: 6px; white-space: nowrap; }
  .tile .val span { font-size: 13px; color: var(--muted); font-weight: 700; letter-spacing: 0; margin-left: 1px; }

  /* ---------- Section ---------- */
  .card { background: var(--card); border-radius: var(--radius); padding: 20px; margin-top: 12px; box-shadow: var(--shadow); }
  .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .card-head > div:first-child { min-width: 0; }
  .eyebrow { font-size: 13px; color: var(--muted); font-weight: 600; }
  .big { font-size: 32px; font-weight: 800; letter-spacing: -0.01em; margin-top: 4px; line-height: 1.1; }
  .big span { font-size: 18px; color: var(--muted); font-weight: 700; letter-spacing: -0.01em; }
  .delta { font-size: 13px; font-weight: 700; margin-top: 4px; color: var(--muted); min-height: 18px; }
  .delta.up { color: var(--good); }
  .split { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 6px; font-size: 14px; font-weight: 800; }
  .split:empty { display: none; }
  .split i { display: inline-block; width: 8px; height: 8px; border-radius: 3px; margin-right: 6px; }

  .seg { display: inline-flex; background: var(--card-2); border-radius: 12px; padding: 3px; position: relative; flex-shrink: 0; }
  .seg button { position: relative; z-index: 1; font-size: 13px; font-weight: 700; padding: 7px 11px; border-radius: 9px; color: var(--muted); transition: color .2s; }
  .seg button.on { color: var(--text); }
  .seg .thumb { position: absolute; top: 3px; bottom: 3px; border-radius: 9px; background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.12); transition: left .3s cubic-bezier(.3,.7,.2,1), width .3s cubic-bezier(.3,.7,.2,1); }
  @media (prefers-color-scheme: dark) { .seg .thumb { background: #3a3a66; } }

  /* ---------- Chart ---------- */
  /* Days: one column per day with the time of day running down, 7am at the top (like Apple Health). */
  .chart { position: relative; margin-top: 20px; }
  .sc { position: relative; height: 300px; }
  .sc-grid { position: absolute; inset: 0 0 22px 0; pointer-events: none; }
  .gl { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--line); }
  .gl b { position: absolute; right: 0; top: -8px; font-size: 10px; font-weight: 700; color: var(--faint); }
  .sc-cols { position: absolute; inset: 0 42px 0 0; display: flex; gap: var(--gap, 8px); }
  .sc-col { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; align-items: center; }
  .sc-track {
    position: relative; flex: 1; width: 100%; max-width: 34px;
    border-radius: var(--r, 8px); background: var(--card-2); transition: opacity .25s;
  }
  .sc-seg { position: absolute; left: 0; right: 0; min-height: 2px; border-radius: var(--r, 8px); transform-origin: top; }
  .sc-seg.night, .hz-seg.night { background: var(--night); }
  .sc-seg.nap, .hz-seg.nap { background: var(--nap); }
  .sc-seg.live.night, .hz-seg.live.night { background: repeating-linear-gradient(-45deg, var(--night), var(--night) 4px, var(--night-2) 4px, var(--night-2) 8px); }
  .sc-seg.live.nap, .hz-seg.live.nap { background: repeating-linear-gradient(-45deg, var(--nap), var(--nap) 4px, var(--nap-2) 4px, var(--nap-2) 8px); }
  /* Feeds: a dot at the time of each feed (blue drinks, green solids), ringed so it reads over sleep blocks. */
  .sc-feed {
    position: absolute; left: 50%; z-index: 1; width: var(--fd, 8px); height: var(--fd, 8px);
    margin: calc(var(--fd, 8px) / -2) 0 0 calc(var(--fd, 8px) / -2); border-radius: 50%;
    box-shadow: 0 0 0 var(--fr, 2px) var(--card);
  }
  .sc-feed.milk, .hz-feed.milk { background: var(--milk); }
  .sc-feed.solid, .hz-feed.solid { background: var(--solid); }
  .sc-now { position: absolute; left: -3px; right: -3px; height: 2px; border-radius: 2px; background: var(--text); opacity: .5; }
  .sc-cols.has-sel .sc-col:not(.sel) .sc-track { opacity: .35; }
  .xl { height: 22px; line-height: 22px; font-size: 11px; font-weight: 700; color: var(--faint); white-space: nowrap; }
  .sc-col.sel .xl { color: var(--text); }
  .chart.anim .sc-seg { animation: growy .5s cubic-bezier(.3, .7, .2, 1) both; }
  .chart.anim .hz-seg { animation: growx .5s cubic-bezier(.3, .7, .2, 1) both; }
  @keyframes growy { from { transform: scaleY(0); opacity: 0; } }
  @keyframes growx { from { transform: scaleX(0); opacity: 0; } }

  /* 24H: one horizontal line for the last 24 hours */
  .hz-track { position: relative; height: 64px; border-radius: 16px; background: var(--card-2); overflow: hidden; }
  .hz-band { position: absolute; top: 0; bottom: 0; background: var(--night); opacity: .08; pointer-events: none; }
  .hz-seg { position: absolute; top: 10px; bottom: 10px; min-width: 3px; border-radius: 8px; transform-origin: left; transition: opacity .25s; }
  .hz-track.has-sel .hz-seg:not(.sel) { opacity: .35; }
  .hz-feeds { position: relative; height: 22px; margin: 6px 2px 0; }
  .hz-feed {
    position: absolute; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%;
    box-shadow: 0 0 0 2px var(--card); transition: opacity .25s;
  }
  .hz-feed::before { content: ""; position: absolute; inset: -10px; } /* bigger tap target */
  .hz-feeds.has-sel .hz-feed:not(.sel), .hz-track.has-sel ~ .hz-feeds .hz-feed { opacity: .35; }
  .hz-feeds .hz-feed.sel { opacity: 1; }
  .hz-axis { position: relative; height: 24px; margin: 0 2px; }
  .hz-axis b { position: absolute; top: 6px; transform: translateX(-50%); font-size: 11px; font-weight: 700; color: var(--faint); white-space: nowrap; }
  .legend { display: flex; align-items: center; gap: 12px; margin-top: 14px; font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; }
  .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 3px; margin-right: 6px; vertical-align: 0; }
  /* Feeds on / off switch in the legend */
  .feed-toggle {
    display: inline-flex; align-items: center; margin: -6px 0; padding: 5px 6px 5px 10px; border-radius: 999px;
    background: var(--card-2); font-size: 12px; font-weight: 700; color: var(--text);
  }
  .feed-toggle i { border-radius: 50%; margin-right: 3px; }
  .feed-toggle i + i { margin-right: 6px; }
  .feed-toggle .sw { position: relative; width: 26px; height: 16px; margin-left: 8px; border-radius: 999px; background: var(--good); }
  .feed-toggle .sw::after { content: ""; position: absolute; top: 2px; left: 12px; width: 12px; height: 12px; border-radius: 50%; background: #fff; }
  .feed-toggle[aria-pressed=false] { color: var(--muted); }
  .feed-toggle[aria-pressed=false] i { opacity: .35; }
  .feed-toggle[aria-pressed=false] .sw { background: var(--faint); }
  .feed-toggle[aria-pressed=false] .sw::after { left: 2px; }

  /* ---------- History ---------- */
  .list-head { display: flex; align-items: center; justify-content: space-between; margin: 26px 4px 8px; }
  .list-head h2 { font-size: 20px; font-weight: 800; letter-spacing: -0.01em; margin: 0; }
  .pill-btn { font-size: 14px; font-weight: 700; padding: 8px 14px; border-radius: 999px; background: var(--card); box-shadow: var(--shadow); display: inline-flex; align-items: center; gap: 6px; }
  .pill-btn:active { transform: scale(.96); }
  .day { margin-top: 12px; background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .day-h { display: flex; justify-content: space-between; padding: 14px 18px 4px; font-size: 13px; color: var(--muted); font-weight: 700; }
  .row { display: flex; align-items: center; gap: 14px; padding: 12px 18px; width: 100%; text-align: left; transition: background .15s; }
  .row:active { background: var(--card-2); }
  .ico { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0; }
  .ico svg { width: 19px; height: 19px; }
  .ico.night { background: rgba(108, 92, 231, 0.14); color: var(--night); }
  .ico.nap { background: rgba(255, 181, 71, 0.18); color: #e8930c; }
  @media (prefers-color-scheme: dark) { .ico.night { color: var(--night-2); } .ico.nap { color: var(--nap); } }
  .row .mid { flex: 1; min-width: 0; }
  .row .t1 { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
  .row .t2 { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .row .dur { font-size: 16px; font-weight: 750; letter-spacing: -0.01em; }
  .row .dur.live { color: var(--night); }
  @media (prefers-color-scheme: dark) { .row .dur.live { color: var(--night-2); } }
  .empty-state { text-align: center; color: var(--muted); font-size: 14px; padding: 34px 20px; background: var(--card); border-radius: var(--radius); margin-top: 12px; box-shadow: var(--shadow); }
  .empty-state .moon { font-size: 34px; margin-bottom: 8px; }
  .day-more {
    display: block; width: 100%; padding: 13px 18px 15px; border-top: 1px solid var(--line);
    font-size: 14px; font-weight: 700; color: var(--night); text-align: center;
  }
  .day-more:active { background: var(--card-2); }
  @media (prefers-color-scheme: dark) { .day-more { color: var(--night-2); } }
  .more { display: block; margin: 14px auto 0; color: var(--muted); font-weight: 700; font-size: 14px; padding: 8px 14px; }

  /* ---------- Sheet ---------- */
  .scrim { position: fixed; inset: 0; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity .3s ease; z-index: 20; -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 21;
    max-width: 480px; margin: 0 auto;
    background: var(--sheet-bg); border-radius: 32px 32px 0 0;
    padding: 10px 20px calc(env(safe-area-inset-bottom) + 20px);
    transform: translateY(105%); transition: transform .38s cubic-bezier(.3,.7,.2,1);
    max-height: 90vh; overflow-y: auto;
  }
  .sheet.open { transform: translateY(0); }
  .grab { width: 38px; height: 5px; border-radius: 3px; background: var(--faint); opacity: .5; margin: 0 auto 16px; }
  .sheet h3 { font-size: 22px; font-weight: 800; letter-spacing: -0.01em; margin: 0 0 4px; }
  .sheet p.hint { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
  .field { background: var(--card-2); border-radius: 16px; padding: 10px 14px; margin-bottom: 10px; display: block; }
  .field span { display: block; font-size: 12px; color: var(--muted); font-weight: 700; }
  .field input { width: 100%; border: 0; background: transparent; outline: none; font-size: 17px; font-weight: 700; padding: 4px 0 2px; min-height: 30px; }
  .field input::-webkit-date-and-time-value { text-align: left; }
  .preview { text-align: center; font-size: 14px; color: var(--muted); margin: 6px 0 14px; min-height: 20px; }
  .preview b { color: var(--text); }
  .preview.bad b { color: var(--danger); }
  .btn { width: 100%; height: 56px; border-radius: 999px; font-size: 17px; font-weight: 750; background: var(--btn); color: var(--btn-text); transition: transform .15s, opacity .2s; }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .35; }
  .btn.ghost { background: transparent; color: var(--danger); margin-top: 6px; }
  .btn.soft { background: var(--card-2); color: var(--text); margin-top: 10px; }
  .menu { background: var(--card-2); border-radius: 18px; overflow: hidden; margin: 14px 0; }
  .menu button, .menu label.mi { display: flex; align-items: center; gap: 12px; width: 100%; padding: 15px 16px; font-size: 16px; font-weight: 650; text-align: left; cursor: pointer; }
  .menu > * + * { border-top: 1px solid var(--line); }
  .menu .danger { color: var(--danger); }
  .menu svg { width: 20px; height: 20px; color: var(--muted); }
  .menu .danger svg { color: var(--danger); }
  .foot { text-align: center; font-size: 12px; color: var(--faint); margin-top: 8px; line-height: 1.5; }
  .menu .right { margin-left: auto; font-size: 14px; color: var(--muted); font-weight: 650; display: inline-flex; align-items: center; gap: 6px; }

  /* ---------- Sync ---------- */
  .avatar .badge {
    position: absolute; right: -1px; bottom: -1px; width: 13px; height: 13px; border-radius: 50%;
    border: 2.5px solid var(--bg); display: none;
  }
  .sdot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); display: inline-block; flex-shrink: 0; }
  .s-live { background: var(--good); }
  .s-wait { background: var(--nap); }
  .s-error { background: var(--danger); }
  .avatar .badge.s-live, .avatar .badge.s-wait, .avatar .badge.s-error { display: block; }
  .sync-status { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; color: var(--muted); margin: -6px 0 16px; }
  .code-card { background: var(--card-2); border-radius: 18px; padding: 16px; text-align: center; margin-bottom: 10px; }
  .code-card span { display: block; font-size: 12px; color: var(--muted); font-weight: 700; margin-bottom: 8px; }
  .code-card b { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 19px; letter-spacing: .04em; font-weight: 800; word-break: break-all; user-select: all; -webkit-user-select: all; }

  .seg.wide button { flex: 1; padding: 10px; font-size: 15px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 2px 0 14px; }
  .chip { padding: 8px 14px; border-radius: 999px; background: var(--card-2); font-size: 14px; font-weight: 700; transition: background .2s, color .2s, transform .1s; }
  .chip:active { transform: scale(.95); }

  .menu .ico { width: 36px; height: 36px; }
  .menu .ico svg { width: 18px; height: 18px; color: inherit; }

  /* ---------- Timeline ---------- */
  .tl { padding: 2px 0 8px; }
  .tl-item {
    display: grid; grid-template-columns: 42px 36px 1fr auto; align-items: center; column-gap: 12px;
    width: 100%; padding: 9px 18px 9px 12px; text-align: left; position: relative; transition: background .15s;
  }
  .tl-item:active { background: var(--card-2); }
  .tl-item::before { content: ""; position: absolute; left: 83px; top: 0; bottom: 0; width: 2px; background: var(--rail); }
  .tl-item:first-child::before { top: 50%; }
  .tl-item:last-child::before { bottom: 50%; }
  .tl-item:only-child::before { display: none; }
  .tl-time { font-size: 13px; font-weight: 700; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
  .tl-item .ico { width: 36px; height: 36px; position: relative; z-index: 1; box-shadow: 0 0 0 4px var(--card); }
  .tl-item .ico svg { width: 17px; height: 17px; }
  .tl-item .ico.night { background: color-mix(in srgb, var(--night) 16%, var(--card)); }
  .tl-item .ico.nap { background: color-mix(in srgb, var(--nap) 20%, var(--card)); }
  .tl-item .ico.milk { background: color-mix(in srgb, var(--milk) 15%, var(--card)); }
  .tl-item .ico.solid { background: color-mix(in srgb, var(--solid) 16%, var(--card)); }
  .tl-item.live .ico::after { content: ""; position: absolute; inset: -3px; border-radius: 50%; border: 2px solid var(--night-2); animation: ping 2s ease-out infinite; }
  .tl-item .mid { min-width: 0; }
  .tl-item .t1 { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tl-item .t2 { font-size: 13px; color: var(--muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .tl-item .dur.live { color: var(--night); }
  @media (prefers-color-scheme: dark) { .tl-item .dur.live { color: var(--night-2); } }

    transform: translate(-50%, calc(100% + 60px)); opacity: 0; transition: transform .35s cubic-bezier(.3,.7,.2,1), opacity .25s;

<script>
(() => {
  'use strict';

  // ---------- Storage ----------
  const KEY = 'sleeptracker.v1';
  const DAY_START_HOUR = 7;   // a "sleep day" runs 7am -> 7am
  const NIGHT_START_HOUR = 19; // 7pm -> 7am counts as night

  let state = load();

  // Feeds: { id, at, type: 'milk' | 'solid', ml, what, updatedAt }. ml is the amount: millilitres for drinks, grams for solids.
  // state.tomb / state.ftomb remember deleted sleep / feed ids so deletions reach the other phone.
  // state.dirty holds changes not yet sent to the sync server.
  function load() {
    const blank = { name: 'Sye', nameAt: 0, sleeps: [], feeds: [], active: null, activeAt: 0, tomb: {}, ftomb: {}, dirty: {}, family: null };
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const s = JSON.parse(raw);
        const sleeps = (Array.isArray(s.sleeps) ? s.sleeps : []).map(x => ({ ...x, updatedAt: x.updatedAt || x.end }));
        const feeds = (Array.isArray(s.feeds) ? s.feeds : []).map(x => ({ ...x, updatedAt: x.updatedAt || x.at }));
        return { ...blank, ...s, name: s.name || 'Sye', sleeps, feeds, tomb: s.tomb || {}, ftomb: s.ftomb || {}, dirty: s.dirty || {} };
      }
    } catch (e) {}
    return blank;
  }
  function saveLocal() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }
  function save() {
    saveLocal();
    Sync.push();
  }

  // ---------- Changes (all edits go through these so sync sees them) ----------
  const COLLS = { sleeps: { prefix: 's:', tomb: 'tomb' }, feeds: { prefix: 'f:', tomb: 'ftomb' } };
  function touch(coll, x) {
    x.updatedAt = Date.now();
    delete state[COLLS[coll].tomb][x.id];
    state.dirty[COLLS[coll].prefix + x.id] = 1;
  }
  function addEntry(coll, x) {
    state[coll].push(x);
    touch(coll, x);
    return x;
  }
  function removeEntry(coll, id) {
    const i = state[coll].findIndex(x => x.id === id);
    if (i < 0) return null;
    const [gone] = state[coll].splice(i, 1);
    state[COLLS[coll].tomb][id] = Date.now();
    state.dirty[COLLS[coll].prefix + id] = 1;
    return gone;
  }
  function restoreEntry(coll, x) {
    if (state[coll].some(y => y.id === x.id)) return;
    addEntry(coll, x);
  }
  function setActive(v) {
    state.active = v;
    state.activeAt = Date.now();
    state.dirty.active = 1;
  }
  function setName(n) {
    state.name = n;
    state.nameAt = Date.now();
    state.dirty.name = 1;
  }
  // Ask the browser to never evict our data.
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}

  // ---------- Helpers ----------
  const $ = (id) => document.getElementById(id);
  const MIN = 60000, HOUR = 3600000;
  const pad = (n) => String(n).padStart(2, '0');
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const buzz = (ms = 10) => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

  function fmtDur(ms, html) {
    const m = Math.max(0, Math.round(ms / MIN));
    const h = Math.floor(m / 60), r = m % 60;
    if (!html) return h ? (r ? `${h}h ${r}m` : `${h}h`) : `${r}m`;
    if (!h) return `${r}<span>m</span>`;
    return r ? `${h}<span>h</span> ${r}<span>m</span>` : `${h}<span>h</span>`;
  }
  function fmtTime(t) {
    const d = new Date(t);
    return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }
  function dayKey(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
  function keyToDate(k) { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); }
  function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function at(d, h) { const x = new Date(d); x.setHours(h, 0, 0, 0); return x.getTime(); }

  // The sleep-day a moment belongs to (before 7am counts as the previous day).
  function sleepDayOf(t) {
    const d = new Date(t);
    return dayKey(d.getHours() < DAY_START_HOUR ? addDays(d, -1) : d);
  }

  // Split an interval into {key, night, ms} chunks on 7am / 7pm boundaries.
  function split(s, e) {
    const out = [];
    let t = s;
    while (t < e) {
      const d = new Date(t), h = d.getHours();
      let next, night, key;
      if (h < DAY_START_HOUR) { next = at(d, DAY_START_HOUR); night = true; key = dayKey(addDays(d, -1)); }
      else if (h < NIGHT_START_HOUR) { next = at(d, NIGHT_START_HOUR); night = false; key = dayKey(d); }
      else { next = at(addDays(d, 1), DAY_START_HOUR); night = true; key = dayKey(d); }
      if (next <= t) next = t + HOUR; // DST safety
      const end = Math.min(next, e);
      out.push({ key, night, ms: end - t, s: t, e: end });
      t = end;
    }
    return out;
  }
  function isNight(s, e) {
    let n = 0, d = 0;
    for (const c of split(s, e)) c.night ? (n += c.ms) : (d += c.ms);
    return n > 0 && n >= d;
  }

  function allSleeps(now) {
    const list = state.sleeps.slice();
    if (state.active) list.push({ id: 'active', start: state.active, end: now, live: true });
    return list;
  }

  function totalsByDay(now) {
    const map = {};
    for (const s of allSleeps(now)) {
      for (const c of split(s.start, s.end)) {
        const m = map[c.key] || (map[c.key] = { night: 0, nap: 0 });
        c.night ? (m.night += c.ms) : (m.nap += c.ms);
      }
    }
    return map;
  }

  // ---------- Face ----------
  // The little character at the top, animated frame by frame like a sprite sheet: every
  // change is a few quick, discrete frames (no tweening or squashing). Eyes are round with
  // flat lid cuts. It sleeps while the baby sleeps, gets drowsier the longer the baby has
  // been awake (1.5h, 2h, 2.5h), and reacts to taps and feeds.
  const Face = (() => {
    const svg = $('face'), hit = $('faceHit');
    const EYE = { L: [62, 54], R: [138, 54] }, ER = 30, VB = [26, 18, 148, 98], REACH = 11;
    const el = (id) => document.getElementById(id);
    const parts = { L: { lid: el('lidL'), g: el('eyeL'), pup: el('pupL'), shut: el('shutL') },
                    R: { lid: el('lidR'), g: el('eyeR'), pup: el('pupR'), shut: el('shutR') } };
    const PUPIL = 20.9, BIG = 24.7;

    // Resting poses. t / b: how much of the eye the top / bottom lid covers (0..1);
    // x / y: pupil offset; r: pupil radius; m: mouth.
    const POSE = {
      awake:   { t: 0,    b: 0,   x: 0, y: 0, r: PUPIL, m: 'smile' },
      drowsy1: { t: .3,   b: 0,   x: 0, y: 3, r: PUPIL, m: 'smile' },
      drowsy2: { t: .48,  b: 0,   x: 0, y: 6, r: PUPIL, m: 'flat' },
      drowsy3: { t: .62,  b: .04, x: 0, y: 8, r: PUPIL, m: 'flat' },
      asleep:  { t: .5,   b: .5,  x: 0, y: 0, r: PUPIL, m: 'sleep' }
    };
    const SHUT = { t: .5, b: .5 };
    const half = (p) => ({ t: p.t + (.5 - p.t) * .55, b: p.b + (.5 - p.b) * .3 });

    let mood = 'awake', big = false, breath = false, gaze = [0, 0];
    let playing = null, stepTimer = null, holdUntil = 0, gazeTimer = null, taps = [], dizzyUntil = 0;

    function base() {
      const p = { ...POSE[big && mood !== 'asleep' ? 'awake' : mood] };
      if (big && mood !== 'asleep') p.r = BIG;
      if (mood === 'asleep' && breath) p.m = 'sleep2';
      return p;
    }
    // Draws one frame: the base pose with the frame's overrides (per eye under L / R).
    function draw(frame = {}) {
      const b = base(), f = typeof frame === 'function' ? frame(b) : frame;
      for (const side of ['L', 'R']) {
        const e = { ...b, ...f, ...(f[side] || {}) }, [cx, cy] = EYE[side], P = parts[side];
        const top = cy - ER + e.t * 2 * ER, bot = cy + ER - e.b * 2 * ER, open = bot - top > 1.5;
        P.lid.setAttribute('y', top.toFixed(2));
        P.lid.setAttribute('height', Math.max(0, bot - top).toFixed(2));
        const gx = e.abs ? 0 : gaze[0], gy = e.abs ? 0 : gaze[1];
        P.pup.setAttribute('cx', (cx + e.x + gx).toFixed(2));
        P.pup.setAttribute('cy', (cy + e.y + gy).toFixed(2));
        P.pup.setAttribute('r', e.r);
        P.g.style.display = open ? '' : 'none';
        P.shut.style.display = open ? 'none' : '';
        if (!open) {
          const y = Math.min(Math.max((top + bot) / 2, cy - ER + 6), cy + ER - 6);
          const w = Math.sqrt(Math.max(0, ER * ER - (y - cy) ** 2)) * .8;
          P.shut.setAttribute('x1', (cx - w).toFixed(2)); P.shut.setAttribute('x2', (cx + w).toFixed(2));
          P.shut.setAttribute('y1', y.toFixed(2)); P.shut.setAttribute('y2', y.toFixed(2));
        }
      }
      svg.dataset.mouth = f.m || b.m;
    }
    const rest = () => { svg.dataset.expr = mood; draw(); };

    // Plays a named sequence of [frame, ms] steps, then returns to the resting pose.
    // While the baby sleeps only sleepy reactions play, unless forced (waking up).
    function play(name, steps, force) {
      if (mood === 'asleep' && !force && !SLEEPY.has(name)) return;
      clearTimeout(stepTimer);
      playing = name;
      svg.dataset.expr = name;
      let i = 0;
      (function next() {
        if (i >= steps.length) { playing = null; rest(); return; }
        const [frame, ms] = steps[i++];
        draw(frame);
        stepTimer = setTimeout(next, ms);
      })();
    }
    const blinkSteps = (ms = 40, hold = 50) => [[half, ms], [SHUT, hold], [half, ms]];
    const repeat = (n, steps) => Array.from({ length: n }, () => steps).flat();
    const SEQ = {
      blink: () => blinkSteps(),
      slowBlink: () => blinkSteps(70, 140),
      longBlink: () => [[half, 90], [SHUT, 1100], [{ t: 0, b: 0 }, 90], [half, 60]],
      yawn: () => [[{ m: 'o' }, 80], [p => ({ ...half(p), m: 'yawn1' }), 80], [p => ({ ...half(p), m: 'yawn2' }), 900],
                   [p => ({ ...half(p), m: 'yawn1' }), 80], [{ m: 'o' }, 80]],
      sleep: () => [[{ t: 0, b: 0, m: 'o' }, 70], [{ t: .3, b: 0, m: 'yawn1' }, 70], [{ t: .45, b: 0, m: 'yawn2' }, 1000],
                    [{ t: .45, b: 0, m: 'yawn1' }, 70], [{ t: .48, b: .2, m: 'flat' }, 160], [{ ...SHUT, m: 'flat' }, 200]],
      wake: () => [[{ t: .35, b: .35, m: 'flat' }, 50], [{ t: 0, b: 0, r: 13, m: 'o' }, 700], [{ t: 0, b: 0, r: 17, m: 'o' }, 60]],
      surprised: () => [[{ t: 0, b: 0, r: 15, m: 'o' }, 45], [{ t: 0, b: 0, r: 12, m: 'o' }, 650], [{ t: 0, b: 0, r: 16, m: 'o' }, 45]],
      peek: () => [[{ L: { t: .35, b: .25 } }, 60], [{ L: { t: .2, b: .15, r: 16 } }, 750], [{ L: { t: .35, b: .25 } }, 60]],
      chew: () => repeat(6, [[{ m: 'chew1' }, 130], [{ m: 'chew2' }, 130]]),
      dizzy: () => repeat(3, Array.from({ length: 8 }, (_, k) => {
        const a = (k / 8) * Math.PI * 2;
        return [{ t: 0, b: 0, abs: true, x: Math.cos(a) * 9, y: Math.sin(a) * 9, m: 'o' }, 55];
      })).concat([[{ t: 0, b: 0, abs: true, m: 'o' }, 200]])
    };
    const SLEEPY = new Set(['peek']);
    const react = (name, force) => play(name, SEQ[name](), force);
    // For reactions after a sheet closes, so the face is in view.
    const later = (name, ms = 220) => setTimeout(() => react(name), ms);

    // Mood from the baby's state: asleep, or how long they've been awake.
    function setState(sleeping, awakeMs) {
      const next = sleeping ? 'asleep'
        : awakeMs >= 2.5 * HOUR ? 'drowsy3' : awakeMs >= 2 * HOUR ? 'drowsy2' : awakeMs >= 1.5 * HOUR ? 'drowsy1' : 'awake';
      if (next === mood && svg.dataset.expr) return;
      mood = next;
      document.documentElement.classList.toggle('night', mood === 'asleep');
      if (mood === 'asleep') gaze = [0, 0];
      if (!playing) rest();
    }
    // Wide-eyed (bigger pupils, lids up) while a feed is being logged.
    function setBig(v) {
      if (v === big) return;
      big = v;
      if (playing) return;
      draw(v ? { r: (PUPIL + BIG) / 2 } : { r: (PUPIL + BIG) / 2 });
      setTimeout(() => { if (!playing) draw(); }, 45);
    }

    // Eyes jump to look somewhere in two quick frames, hold, then jump back.
    function setGaze(target) {
      const mid = [(gaze[0] + target[0]) / 2, (gaze[1] + target[1]) / 2];
      gaze = mid; if (!playing) draw();
      clearTimeout(gazeTimer);
      gazeTimer = setTimeout(() => { gaze = target; if (!playing) draw(); }, 45);
    }
    function lookAt(x, y, ms = 1600) {
      if (mood === 'asleep') return;
      const r = svg.getBoundingClientRect();
      if (!r.width) return;
      const [ex, ey] = EYE.L, [rx] = EYE.R;
      const cx = r.left + (((ex + rx) / 2) - VB[0]) / VB[2] * r.width, cy = r.top + (ey - VB[1]) / VB[3] * r.height;
      const dx = x - cx, dy = y - cy, d = Math.hypot(dx, dy) || 1, k = REACH * Math.min(1, d / 140);
      setGaze([dx / d * k, dy / d * k]);
      holdUntil = Date.now() + ms;
      setTimeout(() => { if (Date.now() >= holdUntil) setGaze([0, 0]); }, ms + 20);
    }

    // Idle life: blinks, glances, and (when drowsy) slow blinks, nodding off and yawns.
    (function idle() {
      const wait = { awake: [2400, 6000], drowsy1: [2500, 5000], drowsy2: [2200, 4500], drowsy3: [1800, 3500], asleep: [1800, 1800] }[mood];
      setTimeout(() => {
        if (!playing && !document.hidden) {
          const r = Math.random();
          if (mood === 'asleep') { breath = !breath; draw(); }
          else if (mood === 'awake') {
            if (r < .2 && Date.now() > holdUntil + 3000) {
              const b = svg.getBoundingClientRect(), [sx, sy] = [[-1, .2], [1, .2], [-.7, -.6], [.7, -.6]][Math.floor(Math.random() * 4)];
              lookAt(b.left + b.width / 2 + sx * 300, b.top + b.height / 2 + sy * 300, 1100);
            } else play('blink', r < .35 ? [...SEQ.blink(), [{}, 120], ...SEQ.blink()] : SEQ.blink());
          }
          else if (mood === 'drowsy1') react('slowBlink');
          else if (mood === 'drowsy2') react(r < .3 ? 'longBlink' : 'slowBlink');
          else react(r < .45 ? 'longBlink' : r < .75 ? 'yawn' : 'slowBlink');
        }
        idle();
      }, wait[0] + Math.random() * (wait[1] - wait[0]));
    })();

    function tapFace() {
      const now = Date.now();
      if (now < dizzyUntil) return; // let the dizzy spin finish
      taps = taps.filter(t => now - t < 2500).concat(now);
      buzz(8);
      if (mood === 'asleep') return react('peek');
      if (taps.length >= 5) { taps = []; dizzyUntil = now + 1600; return react('dizzy'); }
      react('surprised');
    }
    document.addEventListener('pointerdown', e => {
      if (hit.contains(e.target)) tapFace();
      else lookAt(e.clientX, e.clientY);
    }, { capture: true, passive: true });

    rest();
    return { setState, setBig, react, later, lookAt };
  })();

  // ---------- Hero ----------
  const ICON_MOON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 14.3A8.5 8.5 0 0 1 9.7 3.5a.6.6 0 0 0-.8-.7A9.5 9.5 0 1 0 21.2 15.1a.6.6 0 0 0-.7-.8Z"/></svg>';
  const ICON_SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2" fill="currentColor" stroke="none"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>';

  function renderHero(now) {
    const hero = $('hero');
    const sleeping = !!state.active;
    hero.classList.toggle('sleeping', sleeping);

    let ms, label, sub;
    if (sleeping) {
      ms = now - state.active;
      label = `${state.name} is ${isNight(state.active, now) ? 'sleeping' : 'napping'}`;
      sub = `Fell asleep at ${fmtTime(state.active)} · <button id="adjBtn">Adjust</button>`;
    } else {
      const last = state.sleeps.reduce((a, s) => (s.end > a ? s.end : a), 0);
      if (last) {
        ms = now - last;
        label = `${state.name} is awake`;
        sub = `Woke up at ${fmtTime(last)}${new Date(last).toDateString() !== new Date(now).toDateString() ? ' yesterday' : ''}`;
      } else {
        ms = null;
        label = 'Ready when you are';
        sub = 'Tap the button when ' + escapeHtml(state.name) + ' falls asleep.';
      }
    }
    $('statusText').textContent = label;
    Face.setState(sleeping, sleeping || ms == null ? 0 : ms);

    if (ms == null) {
      $('timer').innerHTML = '0<small>m</small>';
    } else {
      const totalS = Math.floor(ms / 1000);
      const h = Math.floor(totalS / 3600), m = Math.floor((totalS % 3600) / 60), s = totalS % 60;
      $('timer').innerHTML = (h ? `${h}<small>h</small> ` : '') + `${m}<small>m</small> <small class="sec">${pad(s)}s</small>`;
    }
    if ($('sub').dataset.html !== sub) {
      $('sub').innerHTML = sub;
      $('sub').dataset.html = sub;
      const adj = $('adjBtn');
      if (adj) adj.onclick = () => openEdit('active');
    }
    const btnHtml = sleeping ? `${ICON_SUN}<span>Wake up</span>` : `${ICON_MOON}<span>Start sleep</span>`;
    if ($('mainBtn').dataset.html !== btnHtml) {
      $('mainBtn').innerHTML = btnHtml;
      $('mainBtn').dataset.html = btnHtml;
    }
  }

  $('mainBtn').addEventListener('click', () => {
    const now = Date.now();
    if (state.active) Face.react('wake', true);
    else Face.react('sleep');
    if (state.active) {
      const start = state.active;
      if (now - start < MIN) {
        setActive(null); save(); renderAll();
        toast('Too short to save');
        buzz(20);
        return;
      }
      const s = addEntry('sleeps', { id: uid(), start, end: now });
      setActive(null); save();
      buzz([12, 60, 12]);
      toast(`Slept ${fmtDur(now - start)}`, () => { removeEntry('sleeps', s.id); setActive(start); save(); renderAll(); });
    } else {
      setActive(now); save();
      buzz(15);
      toast('Sweet dreams 🌙', () => { setActive(null); save(); renderAll(); });
    }
    renderAll();
  });

  // ---------- Tiles ----------
  function renderTiles(now, totals) {
    const today = sleepDayOf(now), h = new Date(now).getHours();
    const t = totals[today] || { night: 0, nap: 0 };
    // Night sleep: tonight once it's evening (7pm to 7am), otherwise last night.
    const tonight = h >= NIGHT_START_HOUR || h < DAY_START_HOUR;
    const lastNight = totals[dayKey(addDays(keyToDate(today), -1))] || { night: 0 };
    $('tNightLabel').textContent = tonight ? 'Tonight' : 'Last night';
    $('tNight').innerHTML = fmtDur(tonight ? t.night : lastNight.night, true);
    $('tNaps').innerHTML = fmtDur(t.nap, true);
    let naps = 0, longest = 0;
    for (const s of allSleeps(now)) {
      if (sleepDayOf(s.start) !== today) continue;
      if (!isNight(s.start, s.end)) naps++;
      longest = Math.max(longest, s.end - s.start);
    }
    $('tNapLabel').textContent = naps === 1 ? '1 nap today' : `${naps} naps today`;
    $('tLong').innerHTML = longest ? fmtDur(longest, true) : '–';
  }

  // ---------- Chart ----------
  let range = 7, selected = null;
  // Whether feeds are drawn on the chart: a per-phone preference, so it lives outside the synced log.
  const FEEDS_KEY = 'sleeptracker.chartFeeds';
  let showFeeds = true;
  try { showFeeds = localStorage.getItem(FEEDS_KEY) !== 'off'; } catch (e) {}
  const WD = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
  const WDL = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  function chartDays(now) {
    const end = keyToDate(sleepDayOf(now));
    const days = [];
    for (let i = range - 1; i >= 0; i--) days.push(dayKey(addDays(end, -i)));
    return days;
  }

  const pct = (x) => `${(x * 100).toFixed(3)}%`;
  // Night and nap totals side by side, with the chart's colours.
  const splitHtml = (night, nap) =>
    `<span><i style="background:var(--night)"></i>${fmtDur(night)} night</span><span><i style="background:var(--nap)"></i>${fmtDur(nap)} naps</span>`;

  // Last 24 hours on one horizontal line. Each sleep is one block, coloured night or nap.
  function renderHourly(now) {
    const w0 = now - 24 * HOUR, w1 = now;
    const segs = allSleeps(now)
      .filter(s => s.end > w0 && s.start < w1)
      .map(s => ({ s: Math.max(s.start, w0), e: Math.min(s.end, w1), night: isNight(s.start, s.end), src: s }))
      .sort((a, b) => a.s - b.s);
    let nightTot = 0, napTot = 0;
    for (const g of segs) g.night ? (nightTot += g.e - g.s) : (napTot += g.e - g.s);

    // faint shading for the night hours (7pm to 7am)
    const bands = split(w0, w1).filter(c => c.night)
      .map(c => `<i class="hz-band" style="left:${pct((c.s - w0) / (w1 - w0))};width:${pct((c.e - c.s) / (w1 - w0))}"></i>`).join('');
    const blocks = segs.map((g, i) =>
      `<i class="hz-seg ${g.night ? 'night' : 'nap'}${g.src.live ? ' live' : ''}${selected === i ? ' sel' : ''}" data-i="${i}" style="left:${pct((g.s - w0) / (w1 - w0))};width:${pct((g.e - g.s) / (w1 - w0))}"></i>`).join('');
    // feeds as dots in a row under the line; selected is 'f<index>' when a feed is tapped
    const feeds = showFeeds ? state.feeds.filter(f => f.at >= w0 && f.at <= w1).sort((a, b) => a.at - b.at) : [];
    const fsel = typeof selected === 'string' ? +selected.slice(1) : null;
    const dots = feeds.map((f, i) =>
      `<i class="hz-feed ${f.type === 'milk' ? 'milk' : 'solid'}${fsel === i ? ' sel' : ''}" data-f="${i}" style="left:${pct((f.at - w0) / (w1 - w0))}"></i>`).join('');
    // a label every 6 hours (00, 06, 12, 18)
    let labels = '';
    const t = new Date(w0); t.setMinutes(0, 0, 0); t.setHours(t.getHours() + 1);
    for (; t.getTime() < w1; t.setHours(t.getHours() + 1)) {
      if (t.getHours() % 6 === 0) labels += `<b style="left:${pct((t.getTime() - w0) / (w1 - w0))}">${pad(t.getHours())}:00</b>`;
    }
    const segSel = typeof selected === 'number';
    $('chart').innerHTML = `<div class="hz"><div class="hz-track${selected != null ? ' has-sel' : ''}">${bands}${blocks}</div>` +
      (showFeeds ? `<div class="hz-feeds${fsel != null ? ' has-sel' : ''}">${dots}</div>` : '') + `<div class="hz-axis">${labels}</div></div>`;
    $('chartNote').textContent = 'Last 24h';

    const el = $('chartDelta');
    el.className = 'delta';
    if (fsel != null && feeds[fsel]) {
      const f = feeds[fsel];
      $('chartEyebrow').textContent = feedLabel(f);
      $('chartBig').innerHTML = f.ml ? `${f.ml}<span> ${f.type === 'milk' ? 'ml' : 'g'}</span>` : (f.type === 'milk' ? 'Drink' : 'Meal');
      el.textContent = fmtTime(f.at);
      $('chartSplit').innerHTML = '';
    } else if (segSel && segs[selected]) {
      const g = segs[selected];
      $('chartEyebrow').textContent = g.night ? 'Night sleep' : 'Nap';
      $('chartBig').innerHTML = fmtDur(g.src.end - g.src.start, true);
      el.textContent = `${fmtTime(g.src.start)} – ${g.src.live ? 'now' : fmtTime(g.src.end)}`;
      $('chartSplit').innerHTML = '';
    } else {
      $('chartEyebrow').textContent = 'Last 24 hours';
      $('chartBig').innerHTML = fmtDur(nightTot + napTot, true);
      $('chartSplit').innerHTML = nightTot + napTot ? splitHtml(nightTot, napTot) : '';
      el.textContent = nightTot + napTot ? 'Tap a block for details' : 'No sleep in the last 24 hours';
    }
  }

  function renderChart(now, totals) {
    if (range === 24) return renderHourly(now);
    $('chartNote').textContent = '7am → 7am';
    const days = chartDays(now);
    const today = days[days.length - 1];
    const vals = days.map(k => ({ k, ...(totals[k] || { night: 0, nap: 0 }) }));
    const sum = v => v.night + v.nap;

    // Average over finished days that have data; fall back to today.
    const done = vals.filter(v => v.k !== today && sum(v) > 0);
    const pool = done.length ? done : vals.filter(v => sum(v) > 0);
    const avg = pool.length ? pool.reduce((a, v) => a + sum(v), 0) / pool.length : 0;

    // Where each sleep sits within its day (7am at the top, 7am next day at the bottom).
    const chunks = {};
    for (const sl of allSleeps(now)) {
      for (const c of split(sl.start, sl.end)) (chunks[c.key] || (chunks[c.key] = [])).push({ ...c, live: sl.live });
    }
    const feedsOf = {};
    for (const f of state.feeds) (feedsOf[sleepDayOf(f.at)] || (feedsOf[sleepDayOf(f.at)] = [])).push(f);
    const labelEvery = range === 7 ? 1 : range === 14 ? 2 : 5;
    const cols = vals.map((v, i) => {
      const d = keyToDate(v.k), ws = at(d, DAY_START_HOUR), span = at(addDays(d, 1), DAY_START_HOUR) - ws;
      const segs = (chunks[v.k] || []).map(c =>
        `<i class="sc-seg ${c.night ? 'night' : 'nap'}${c.live ? ' live' : ''}" style="top:${pct((c.s - ws) / span)};height:${pct((c.e - c.s) / span)}"></i>`).join('');
      const nowLine = v.k === today ? `<i class="sc-now" style="top:${pct((now - ws) / span)}"></i>` : '';
      const dots = (showFeeds ? feedsOf[v.k] || [] : []).map(f =>
        `<i class="sc-feed ${f.type === 'milk' ? 'milk' : 'solid'}" style="top:${pct((f.at - ws) / span)}"></i>`).join('');
      const fromEnd = vals.length - 1 - i;
      const label = range === 7 ? WD[d.getDay()] : (fromEnd % labelEvery === 0 ? d.getDate() : '');
      return `<button class="sc-col${selected === i ? ' sel' : ''}" data-i="${i}"><div class="sc-track">${segs}${dots}${nowLine}</div><span class="xl">${label}</span></button>`;
    }).join('');
    const grid = ['07:00', '13:00', '19:00', '01:00', '07:00']
      .map((t, i) => `<div class="gl" style="top:${i * 25}%"><b>${t}</b></div>`).join('');
    const gap = range === 7 ? '12px' : range === 14 ? '6px' : '3px', r = range === 30 ? '3px' : range === 14 ? '5px' : '8px';
    const fd = range === 30 ? '5px' : range === 14 ? '7px' : '9px', fr = range === 30 ? '1px' : '2px';
    $('chart').innerHTML = `<div class="sc" style="--gap:${gap};--r:${r};--fd:${fd};--fr:${fr}"><div class="sc-grid">${grid}</div><div class="sc-cols${selected != null ? ' has-sel' : ''}">${cols}</div></div>`;

    // header
    if (selected != null && vals[selected]) {
      const v = vals[selected], d = keyToDate(v.k);
      $('chartEyebrow').textContent = v.k === today ? 'Today so far' : `${WDL[d.getDay()]}, ${d.getDate()} ${MON[d.getMonth()]}`;
      $('chartBig').innerHTML = fmtDur(sum(v), true);
      $('chartDelta').className = 'delta';
      $('chartSplit').innerHTML = sum(v) ? splitHtml(v.night, v.nap) : '';
      const ft = feedsByDay()[v.k];
      // each drink type separately (milk, formula, water), then meals
      const drinkBits = ft ? Object.entries(ft.byDrink)
        .sort(([a], [b]) => (DRINKS.indexOf(a) + 1 || 99) - (DRINKS.indexOf(b) + 1 || 99))
        .map(([what, d]) => d.ml ? `${d.ml} ml ${what.toLowerCase()}` : `${d.n}× ${what.toLowerCase()}`) : [];
      const fbits = ft ? [...drinkBits, ft.meals ? `${ft.meals} meal${ft.meals === 1 ? '' : 's'}${ft.g ? ` (${ft.g} g)` : ''}` : ''].filter(Boolean) : [];
      $('chartDelta').textContent = fbits.length ? `Fed ${fbits.join(' · ')}` : sum(v) ? '' : 'No sleep logged';
    } else {
      $('chartEyebrow').textContent = `Daily average · ${range} days`;
      $('chartBig').innerHTML = avg ? fmtDur(avg, true) : '0<span>h</span>';

      $('chartSplit').innerHTML = avg ? splitHtml(avgOf('night'), avgOf('nap')) : '';
      // Compare to the previous period of the same length
      const prevEnd = addDays(keyToDate(days[0]), -1);
      let pSum = 0, pN = 0;
      for (let i = 0; i < range; i++) {
        const t = totals[dayKey(addDays(prevEnd, -i))];
        if (t && t.night + t.nap > 0) { pSum += t.night + t.nap; pN++; }
      }
      const el = $('chartDelta');
      if (avg && pN) {
        const diff = avg - pSum / pN;
        el.className = 'delta' + (diff > 0 ? ' up' : '');

        el.textContent = avg ? 'Tap a day for details' : 'Your chart fills in as you log sleep';
      }
    }

  const DRINKS = ['Milk', 'Formula', 'Water'];

  // Checks a feed from a backup or the other phone; returns a clean copy or null.
  function cleanFeed(f) {
    if (!f || typeof f.at !== 'number' || (f.type !== 'milk' && f.type !== 'solid')) return null;
    const ml = typeof f.ml === 'number' && f.ml > 0 && f.ml <= 2000 ? Math.round(f.ml) : null;
    return { id: String(f.id || uid()), at: f.at, type: f.type, ml, what: typeof f.what === 'string' ? f.what.slice(0, 160) : '' };
  }
  function parseFoods(text) {
    const out = [];
    for (const raw of String(text || '').split(/[,\n;]+/)) {
      const t = raw.trim().replace(/\s+/g, ' ').slice(0, 30);
      if (!t) continue;
      const nice = t[0].toUpperCase() + t.slice(1);
      if (!out.some(x => x.toLowerCase() === nice.toLowerCase())) out.push(nice);
    }
    return out.slice(0, 8);
  }
  function feedsByDay() {
    const map = {};
    for (const f of state.feeds) {
      const k = sleepDayOf(f.at);
      const m = map[k] || (map[k] = { ml: 0, drinks: 0, meals: 0, g: 0, byDrink: {} });
      if (f.type === 'milk') {
        m.drinks++; m.ml += f.ml || 0;
        const d = m.byDrink[f.what || 'Milk'] || (m.byDrink[f.what || 'Milk'] = { ml: 0, n: 0 });
        d.ml += f.ml || 0; d.n++;
      } else { m.meals++; m.g += f.ml || 0; }
    }
    return map;
  }
  function fmtAgo(ms) { return ms < MIN ? 'just now' : `${fmtDur(ms)} ago`; }
  function lastFeed(type) {

  // ---------- Timeline ----------
  let showDays = 7;
  // Each day shows its newest few entries; 'Show N more' opens the rest of that day.
  const DAY_PREVIEW = 4;
  const openDays = new Set();
  function relDay(k, now) {
    const today = sleepDayOf(now);
    if (k === today) return 'Today';
    if (k === dayKey(addDays(keyToDate(today), -1))) return 'Yesterday';
    const d = keyToDate(k);
    return `${WDL[d.getDay()].slice(0, 3)}, ${d.getDate()} ${MON[d.getMonth()]}`;
  }
  function renderHistory(now, totals, ftotals) {
    const items = [
      ...allSleeps(now).map(s => ({ kind: 'sleep', t: s.start, x: s })),
      ...state.feeds.map(f => ({ kind: 'feed', t: f.at, x: f }))
    ].sort((a, b) => b.t - a.t);
    const el = $('history');
    if (!items.length) {
      el.innerHTML = `<div class="empty-state"><div class="moon">🌙</div>Nothing logged yet.<br>Tap <b>Start sleep</b>, <b>Liquids</b> or <b>Solids</b> above,<br>or <b>Add</b> something you missed.</div>`;
      return;
    }
    // time since the previous drink, shown under each drink
    const gap = {};
    state.feeds.filter(f => f.type === 'milk').sort((a, b) => a.at - b.at)
      .forEach((f, i, a) => { if (i && f.at - a[i - 1].at < 24 * HOUR) gap[f.id] = f.at - a[i - 1].at; });

    const groups = new Map();
    for (const it of items) {
      const k = sleepDayOf(it.t);
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(it);
    }
    let html = '', n = 0;
    for (const [k, list] of groups) {
      if (n++ >= showDays) break;
      const t = totals[k] || { night: 0, nap: 0 }, ft = ftotals[k] || { ml: 0, meals: 0, g: 0 };
      const sum = [];
      if (t.night + t.nap) sum.push(`${fmtDur(t.night + t.nap)} sleep`);
      if (ft.ml) sum.push(`${ft.ml} ml`);
      if (ft.meals) sum.push(`${ft.meals} meal${ft.meals === 1 ? '' : 's'}`);
      if (ft.g) sum.push(`${ft.g} g`);
      html += `<div class="day" data-k="${k}"><div class="day-h"><span>${relDay(k, now)}</span><span>${sum.join(' · ')}</span></div><div class="tl">`;
      const open = openDays.has(k), hidden = list.length - DAY_PREVIEW;
      for (const it of open || hidden <= 0 ? list : list.slice(0, DAY_PREVIEW)) {
        const x = it.x;
        if (it.kind === 'sleep') {
          const night = isNight(x.start, x.end);
          html += `<button class="tl-item${x.live ? ' live' : ''}" data-sleep="${x.id}">
            <div class="tl-time">${fmtTime(x.start)}</div>
            <div class="ico ${night ? 'night' : 'nap'}">${night ? ICON_MOON : ICON_SUN}</div>
            <div class="mid"><div class="t1">${night ? 'Night sleep' : 'Nap'}</div>
            <div class="t2">${x.live ? 'Sleeping now' : `Woke at ${fmtTime(x.end)}`}</div></div>
            <div class="dur${x.live ? ' live' : ''}">${fmtDur(x.end - x.start)}</div>
          </button>`;
        } else {
          const milk = x.type === 'milk';
          const t2 = milk ? (gap[x.id] ? `${fmtDur(gap[x.id])} after last drink` : 'Drink') : 'Solids';
          html += `<button class="tl-item" data-feed-id="${x.id}">
            <div class="tl-time">${fmtTime(x.at)}</div>
            <div class="ico ${milk ? 'milk' : 'solid'}">${milk ? ICON_BOTTLE : ICON_BOWL}</div>
            <div class="mid"><div class="t1">${escapeHtml(feedLabel(x))}</div><div class="t2">${t2}</div></div>
            <div class="dur">${x.ml ? `${x.ml} ${milk ? 'ml' : 'g'}` : ''}</div>
          </button>`;
        }
      }
      html += '</div>';
      if (hidden > 0) html += `<button class="day-more" data-day="${k}">${open ? 'Show less' : `Show ${hidden} more`}</button>`;
      html += '</div>';
    }
    if (groups.size > showDays) html += `<button class="more" id="moreBtn">Show more days</button>`;
    el.innerHTML = html;
    el.querySelectorAll('[data-sleep]').forEach(r => r.addEventListener('click', () => openEdit(r.dataset.sleep)));
    el.querySelectorAll('[data-feed-id]').forEach(r => r.addEventListener('click', () => openFeed(null, r.dataset.feedId)));
    el.querySelectorAll('[data-day]').forEach(b => b.addEventListener('click', () => {
      const k = b.dataset.day, closing = openDays.has(k);

    }));
    const more = $('moreBtn');
    if (more) more.onclick = () => { showDays += 14; renderAll(); };
  }

  const toLocalInput = (t) => {

  const fromLocalInput = (v) => v ? new Date(v).getTime() : NaN;

  let editing = null; // null = new, 'active' = running sleep, else id
  function openEdit(id) {
    editing = id || null;
    const now = Date.now();

    } else if (s) {

      $('delBtn').textContent = 'Delete';
      $('delBtn').style.display = '';
    } else {
      $('editTitle').textContent = 'Add sleep';

      $('inEnd').value = toLocalInput(now);
      $('endField').style.display = '';
      $('delBtn').style.display = 'none';
    }

    show($('editSheet'));
  }
  function readEdit() {
    const s = fromLocalInput($('inStart').value);
    const e = editing === 'active' ? Date.now() : fromLocalInput($('inEnd').value);
    return { s, e };
  }
  function updatePreview() {
    const { s, e } = readEdit();
    const p = $('preview');
    let ok = true, msg;
    if (isNaN(s) || isNaN(e)) { ok = false; msg = '<b>Pick both times</b>'; }
    else if (s > Date.now()) { ok = false; msg = '<b>That’s in the future</b>'; }
    else if (e <= s) { ok = false; msg = '<b>Wake-up must be after falling asleep</b>'; }
    else if (e - s > 24 * HOUR) { ok = false; msg = '<b>That’s longer than 24 hours</b>'; }
    else msg = editing === 'active' ? `Asleep for <b>${fmtDur(e - s)}</b> so far` : `<b>${fmtDur(e - s)}</b> · ${isNight(s, e) ? 'night sleep' : 'nap'}`;
    p.innerHTML = msg;
    p.classList.toggle('bad', !ok);
    $('saveBtn').disabled = !ok;
  }
  $('inStart').addEventListener('input', updatePreview);
  $('inEnd').addEventListener('input', updatePreview);

  $('saveBtn').addEventListener('click', () => {
    const { s, e } = readEdit();
    if (editing === 'active') {
      if (state.active) setActive(s);
    } else if (editing) {
      const x = state.sleeps.find(x => x.id === editing);
      if (x) { x.start = s; x.end = Math.min(e, Date.now()); touch('sleeps', x); }
    } else {
      addEntry('sleeps', { id: uid(), start: s, end: Math.min(e, Date.now()) });
    }
    save(); hide(); buzz(10); renderAll();
    toast('Saved');
  });

  $('delBtn').addEventListener('click', () => {
    if (editing === 'active') {
      const prev = state.active;
      setActive(null); save(); hide(); renderAll();
      toast('Sleep cancelled', () => { setActive(prev); save(); renderAll(); });
      return;
    }
    const removed = removeEntry('sleeps', editing);
    if (!removed) return hide();
    save(); hide(); buzz(20); renderAll();
    Face.later('surprised');
    toast('Deleted', () => { restoreEntry('sleeps', removed); save(); renderAll(); });
  });

  $('addBtn').addEventListener('click', () => show($('addSheet')));
  $('addSheet').querySelectorAll('[data-add]').forEach(b => b.addEventListener('click', () => {
    $('addSheet').classList.remove('open');
    b.dataset.add === 'sleep' ? openEdit(null) : openFeed(b.dataset.add);
  }));

  // Settings
  $('avatar').addEventListener('click', () => {
    $('inName').value = state.name;
    $('foot').textContent = `${state.sleeps.length} sleeps · ${state.feeds.length} feeds logged`;
    $('setHint').textContent = state.family
      ? 'Sync is on: this log is shared with your partner’s phone.'
      : 'Everything stays on this phone. Nothing is uploaded anywhere.';
    renderSyncUi();
    show($('setSheet'));
  });
  $('inName').addEventListener('input', () => {
    setName($('inName').value.trim() || 'Sye');
    save(); renderHeader();
  });
  $('setDone').addEventListener('click', hide);

  $('exportBtn').addEventListener('click', async () => {
    const data = JSON.stringify({ app: 'sleep-tracker', version: 1, exported: new Date().toISOString(), ...state }, null, 2);
    const name = `${state.name.replace(/[^\w-]+/g, '') || 'baby'}-sleep-${dayKey(new Date())}.json`;
    const file = new File([data], name, { type: 'application/json' });
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: 'Sleep backup' });
        return;
      }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(file); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    toast('Backup saved');
  });

  $('importInput').addEventListener('change', async (ev) => {
    const f = ev.target.files && ev.target.files[0];
    ev.target.value = '';
    if (!f) return;
    try {
      const d = JSON.parse(await f.text());
      if (!Array.isArray(d.sleeps) && !Array.isArray(d.feeds)) throw new Error('bad');
      const clean = (d.sleeps || [])
        .filter(s => s && typeof s.start === 'number' && typeof s.end === 'number' && s.end > s.start)
        .map(s => ({ id: String(s.id || uid()), start: s.start, end: s.end }));
      // merge, skipping exact duplicates
      const seen = new Set(state.sleeps.map(s => s.start + ':' + s.end));
      let added = 0;
      for (const s of clean) {
        if (seen.has(s.start + ':' + s.end) || state.sleeps.some(x => x.id === s.id)) continue;
        addEntry('sleeps', s); added++;
      }
      const feeds = (d.feeds || []).map(cleanFeed).filter(Boolean);
      const seenF = new Set(state.feeds.map(f => f.at + ':' + f.type));
      for (const f of feeds) {
        if (seenF.has(f.at + ':' + f.type) || state.feeds.some(x => x.id === f.id)) continue;
        addEntry('feeds', f); added++;
      }
      if (d.name && state.name === 'Sye') setName(String(d.name).slice(0, 24));
      save(); hide(); renderAll();
      toast(`Restored ${added} entr${added === 1 ? 'y' : 'ies'}`);
    } catch (e) {
      toast('That file isn’t a backup');
    }
  });

  $('wipeBtn').addEventListener('click', () => {
    const msg = state.family
      ? 'Delete all sleeps and feeds? Sync is on, so this also deletes them on your partner’s phone. This can’t be undone (unless you have a backup).'
      : 'Delete all sleeps and feeds on this phone? This can’t be undone (unless you have a backup).';
    if (!confirm(msg)) return;
    for (const s of state.sleeps.slice()) removeEntry('sleeps', s.id);
    for (const f of state.feeds.slice()) removeEntry('feeds', f.id);
    if (state.active) setActive(null);
    save(); hide(); renderAll();
    toast('All data deleted');
  });

  // ---------- Toast ----------
  let toastTimer;
  function toast(text, undo) {
    $('toastText').textContent = text;
    const b = $('toastBtn');
    b.hidden = !undo;
    b.onclick = () => { undo && undo(); $('toast').classList.remove('show'); buzz(8); };
    $('toast').classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => $('toast').classList.remove('show'), undo ? 4500 : 2200);
  }

  function escapeHtml(s) { return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

  // ---------- Sync ----------
  // Each phone keeps its own copy and sends changes to a shared Firebase
  // database. For every entry the most recent change wins.
  const Sync = (() => {
    const cfg = window.SYNC_CONFIG;
    let backend = null, unsub = null, status = 'off', pushing = false, again = false;
    const configured = () => !!window.__TEST_BACKEND__ || !!(cfg && cfg.projectId);

    async function getBackend() {
      if (backend) return backend;
      if (window.__TEST_BACKEND__) return (backend = window.__TEST_BACKEND__);
      const base = 'https://www.gstatic.com/firebasejs/10.12.2/';
      const [A, F] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-firestore.js')]);
      const db = F.getFirestore(A.initializeApp(cfg));
      backend = {
        listen(fid, onDocs, onState) {
          const subs = ['sleeps', 'feeds', 'meta'].map(coll => F.onSnapshot(
            F.collection(db, 'families', fid, coll),
            { includeMetadataChanges: true },
            snap => {
              onDocs(coll, snap.docChanges().map(c => ({ id: c.doc.id, data: c.doc.data() })));
              onState(snap.metadata.fromCache ? 'wait' : 'live');
            },
            err => onState('error', err)
          ));
          return () => subs.forEach(u => u());
        },
        put(fid, coll, id, data) { return F.setDoc(F.doc(db, 'families', fid, coll, id), data); }
      };
      return backend;
    }

    function setStatus(s) { status = s; renderSyncUi(); }

    async function start() {
      if (!state.family || !configured() || unsub) return;
      setStatus('wait');
      let b;
      try { b = await getBackend(); } catch (e) { console.warn('sync: could not load', e); return; } // offline; retried on 'online'
      if (unsub || !state.family) return;
      const fid = state.family;
      unsub = b.listen(fid,
        (coll, docs) => { if (fid === state.family) applyRemote(coll, docs); },
        (s, err) => { if (err) console.warn('sync', err); setStatus(s); if (s === 'live') push(); });
      push();
    }
    function stop() {
      if (unsub) unsub();
      unsub = null;
      setStatus('off');
    }

    // What to send for one pending change.
    function docFor(key) {
      if (key === 'active') return { coll: 'meta', id: 'active', data: { value: state.active || null, updatedAt: state.activeAt || 0 } };
      if (key === 'name') return { coll: 'meta', id: 'name', data: { value: state.name, updatedAt: state.nameAt || 0 } };
      const coll = key.startsWith('f:') ? 'feeds' : 'sleeps';
      const id = key.slice(2), x = state[coll].find(y => y.id === id), gone = state[COLLS[coll].tomb][id];
      if (x && coll === 'sleeps') return { coll, id, data: { start: x.start, end: x.end, updatedAt: x.updatedAt, deleted: false } };
      if (x) return { coll, id, data: { at: x.at, type: x.type, ml: x.ml ?? null, what: x.what || '', updatedAt: x.updatedAt, deleted: false } };
      if (gone) return { coll, id, data: { deleted: true, updatedAt: gone } };
      return null;
    }

    async function push() {
      if (!state.family || !backend || !unsub) return;
      if (pushing) { again = true; return; }
      pushing = true;
      try {
        do {
          again = false;
          const fid = state.family;
          const jobs = Object.keys(state.dirty).map(key => {
            const d = docFor(key);
            if (!d) { delete state.dirty[key]; return null; }
            return backend.put(fid, d.coll, d.id, d.data).then(() => {
              // Only clear it if nothing changed while it was being sent.
              const now = docFor(key);
              if (fid === state.family && now && now.data.updatedAt === d.data.updatedAt) delete state.dirty[key];
            });
          }).filter(Boolean);
          if (!jobs.length) break;
          await Promise.all(jobs);
          saveLocal();
        } while (again);
      } catch (e) {
        console.warn('sync: send failed', e);
        setStatus('error');
      } finally {
        pushing = false;
      }
    }

    function applyRemote(coll, docs) {
      let changed = false;
      for (const { id, data } of docs) {
        if (!data || typeof data.updatedAt !== 'number') continue;
        if (COLLS[coll]) {
          const list = state[coll], tomb = state[COLLS[coll].tomb];
          const i = list.findIndex(x => x.id === id);
          const localAt = i >= 0 ? list[i].updatedAt : (tomb[id] || 0);
          if (!(data.updatedAt > localAt)) continue;
          if (data.deleted) {
            if (i >= 0) list.splice(i, 1);
            tomb[id] = data.updatedAt;
          } else {
            let x;
            if (coll === 'sleeps') {
              if (typeof data.start !== 'number' || typeof data.end !== 'number') continue;
              x = { id, start: data.start, end: data.end };
            } else {
              x = cleanFeed({ ...data, id });
              if (!x) continue;
            }
            x.updatedAt = data.updatedAt;
            if (i >= 0) list[i] = x; else list.push(x);
            delete tomb[id];
          }
          delete state.dirty[COLLS[coll].prefix + id];
          changed = true;
        } else if (id === 'active' && data.updatedAt > (state.activeAt || 0)) {
          state.active = typeof data.value === 'number' ? data.value : null;
          state.activeAt = data.updatedAt;
          delete state.dirty.active;
          changed = true;
        } else if (id === 'name' && typeof data.value === 'string' && data.updatedAt > (state.nameAt || 0)) {
          state.name = data.value.slice(0, 24) || 'Sye';
          state.nameAt = data.updatedAt;
          delete state.dirty.name;
          changed = true;
        }
      }
      if (changed) { saveLocal(); renderAll(); }
    }

    // Queue everything on this phone so it gets shared when sync starts.
    function shareAll() {
      for (const coll in COLLS) {
        const { prefix, tomb } = COLLS[coll];
        for (const x of state[coll]) state.dirty[prefix + x.id] = 1;
        for (const id in state[tomb]) state.dirty[prefix + id] = 1;
      }
      if (state.activeAt) state.dirty.active = 1;
      if (state.nameAt) state.dirty.name = 1;
    }
    function begin(code) {
      stop();
      state.family = code;
      shareAll();
      saveLocal();
      start();
    }
    function leave() {
      stop();
      state.family = null;
      state.dirty = {};
      saveLocal();
    }

    window.addEventListener('online', () => { unsub ? push() : start(); });
    window.addEventListener('offline', () => { if (unsub) setStatus('wait'); });

    return { configured, start, stop, push, begin, leave, status: () => status };
  })();

  // Family codes: 20 characters (about 100 bits), shown as XXXXX-XXXXX-XXXXX-XXXXX.
  const CODE_CHARS = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  function newCode() {
    const r = crypto.getRandomValues(new Uint8Array(20));
    return Array.from(r, b => CODE_CHARS[b % CODE_CHARS.length]).join('');
  }
  const fmtCode = (c) => c.match(/.{1,5}/g).join('-');
  function parseCode(text) {
    const up = String(text || '').toUpperCase();
    const m = up.match(/[A-Z0-9]{5}-[A-Z0-9]{5}-[A-Z0-9]{5}-[A-Z0-9]{5}/);
    const raw = (m ? m[0] : up).replace(/[^A-Z0-9]/g, '');
    return raw.length === 20 && [...raw].every(ch => CODE_CHARS.includes(ch)) ? raw : null;
  }

  const SYNC_TEXT = { off: 'Off', wait: 'Connecting…', live: 'On', error: 'Problem' };
  const SYNC_CLASS = { off: '', wait: 's-wait', live: 's-live', error: 's-error' };
  function syncStatusLine() {
    const s = Sync.status();
    if (s === 'live') return 'Synced · up to date';
    if (s === 'error') return 'Can’t sync right now. Check the setup steps, then reopen the app.';
    return navigator.onLine === false ? 'Offline · changes will sync when you’re back online' : 'Connecting…';
  }
  function renderSyncUi() {
    const s = Sync.status();
    $('syncBadge').className = 'badge ' + SYNC_CLASS[s];
    $('syncRowState').innerHTML = state.family ? `<i class="sdot ${SYNC_CLASS[s]}"></i>${SYNC_TEXT[s]}` : (Sync.configured() ? 'Off' : 'Set up');
    const line = $('syncLine');
    if (line) line.innerHTML = `<i class="sdot ${SYNC_CLASS[s]}"></i>${syncStatusLine()}`;
  }

  const SETUP_URL = 'https://github.com/SlavVitanov/Sleep-tracker#sync-between-two-phones';
  function renderSyncSheet(view) {
    const body = $('syncBody');
    if (!Sync.configured()) {
      body.innerHTML = `<h3>Sync with partner</h3>
        <p class="hint">See the same log on both phones. This needs a one-time setup of about 10 minutes, done by whoever looks after the app.</p>
        <a class="btn" style="display:grid;place-items:center;text-decoration:none" href="${SETUP_URL}" target="_blank" rel="noopener">Open the setup guide</a>
        <button class="btn soft" data-act="close">Not now</button>`;
    } else if (state.family) {
      body.innerHTML = `<h3>Sync is on</h3>
        <div class="sync-status" id="syncLine"></div>
        <div class="code-card"><span>Family code</span><b>${fmtCode(state.family)}</b></div>
        <p class="hint">On your partner’s phone, open the app, tap the round initial → <b>Sync with partner</b> → <b>I have a code</b>, and paste this code. Keep it private: anyone with it can see and change the log.</p>
        <button class="btn" data-act="share">Send code to partner</button>
        <button class="btn soft" data-act="close">Done</button>
        <button class="btn ghost" data-act="leave">Stop syncing on this phone</button>`;
    } else if (view === 'join') {
      body.innerHTML = `<h3>Join your partner</h3>
        <p class="hint">On the phone that already syncs, tap the round initial → <b>Sync with partner</b> → <b>Send code to partner</b>. Then paste the code here.</p>
        <label class="field"><span>Family code</span><input class="code" id="inCode" placeholder="XXXXX-XXXXX-XXXXX-XXXXX" autocomplete="off" autocapitalize="characters" spellcheck="false"></label>
        <div class="preview" id="codeHint"></div>
        <button class="btn" data-act="join" id="joinBtn" disabled>Join</button>
        <button class="btn soft" data-act="back">Back</button>`;
      const inp = $('inCode');
      inp.addEventListener('input', () => {
        const ok = !!parseCode(inp.value);
        $('joinBtn').disabled = !ok;
        $('codeHint').innerHTML = inp.value.trim() && !ok ? 'That doesn’t look like a family code yet' : '';
      });
    } else {
      body.innerHTML = `<h3>Sync with partner</h3>
        <p class="hint">Log on either phone and see it on both, live. Everything already on this phone is kept and shared.</p>
        <button class="btn" data-act="create">Start syncing</button>
        <button class="btn soft" data-act="toJoin">I have a code from my partner</button>`;
    }
    body.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => syncAction(b.dataset.act)));
    renderSyncUi();
  }

  async function syncAction(act) {
    buzz(8);
    if (act === 'close') return hide();
    if (act === 'toJoin') return renderSyncSheet('join');
    if (act === 'back') return renderSyncSheet();
    if (act === 'create') {
      Sync.begin(newCode());
      renderSyncSheet();
      return toast('Sync is on');
    }
    if (act === 'join') {
      const code = parseCode($('inCode').value);
      if (!code) return;
      Sync.begin(code);
      renderSyncSheet();
      return toast('Joined · syncing now');
    }
    if (act === 'leave') {
      if (!confirm('Stop syncing on this phone? The log stays on this phone, but new changes won’t be shared.')) return;
      Sync.leave();
      renderSyncSheet();
      return toast('Sync turned off');
    }
    if (act === 'share') {
      const link = location.origin + location.pathname;
      const text = `Join ${state.name}'s sleep tracker:\n1. Open ${link} and add it to your home screen\n2. Open it, tap the round initial → Sync with partner → I have a code\n3. Paste this code: ${fmtCode(state.family)}`;
      try {
        if (navigator.share) { await navigator.share({ text }); return; }
      } catch (e) { if (e && e.name === 'AbortError') return; }
      try { await navigator.clipboard.writeText(text); toast('Code copied'); }
      catch (e) { toast('Copy the code above'); }
    }
  }

  $('syncRow').addEventListener('click', () => {
    if (openSheet) openSheet.classList.remove('open');
    renderSyncSheet();
    show($('syncSheet'));
  });

  // ---------- Tick ----------
  renderAll();
  Sync.start();
  requestAnimationFrame(() => placeThumb(seg));
  window.addEventListener('resize', () => placeThumb(seg));
  let lastMinute = Math.floor(Date.now() / MIN);
  setInterval(() => {
    const now = Date.now();
    renderHero(now);
    const m = Math.floor(now / MIN);
    if (m !== lastMinute) { lastMinute = m; renderAll(); }
  }, 1000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { state = load(); renderAll(); state.family ? Sync.start() : Sync.stop(); } });

  // ---------- Offline ----------
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
