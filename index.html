<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Sleep</title>
<meta name="description" content="A tiny sleep tracker for your little one.">
<meta name="theme-color" content="#13132a" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#fbf6f0" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sleep">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  @font-face {
    font-family: "Nunito";
    src: url(fonts/nunito.woff2) format("woff2");
    font-weight: 200 1000;
    font-display: swap;
  }
  :root {
    --bg: #fbf6f0;
    --card: #ffffff;
    --card-2: #f5ede4;
    --text: #2b2622;
    --muted: #8c8178;
    --faint: #c2b8ad;
    --line: rgba(70, 45, 20, 0.08);
    --night: #6a62e0;
    --night-2: #8e87f0;
    --nap: #ffbe3d;
    --nap-2: #ffd98a;
    --sun: #ff8a3d;
    --good: #2bb673;
    --danger: #f2545b;
    --milk: #3c9bef;
    --solid: #2bb673;
    --rail: rgba(70, 45, 20, 0.1);
    --btn: #2b2622;
    --btn-text: #ffffff;
    --shadow: 0 1px 2px rgba(70, 45, 20, 0.04), 0 8px 24px rgba(70, 45, 20, 0.06);
    --sheet-bg: #fffdfa;
    --scrim: rgba(40, 25, 10, 0.32);
    --radius: 26px;
    /* the face at the top: --ink is its lines, --mouth its open mouth */
    --fz-h: max(176px, 25vh);
    --ink: #2b2622;
    --mouth: #2b2622;
    --tongue: #ff7fa8;
    color-scheme: light;
  }
  @supports (height: 1svh) { :root { --fz-h: max(176px, 25svh); } }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #13132a;
      --card: #1e1e3b;
      --card-2: #2a2a4d;
      --text: #f6f1ea;
      --muted: #a19dc2;
      --faint: #5e5a85;
      --line: rgba(255, 255, 255, 0.06);
      --night: #8078f0;
      --night-2: #a49ef7;
      --sun: #ff9a52;
      --milk: #5aaaf5;
      --solid: #3ccf8a;
      --rail: rgba(255, 255, 255, 0.09);
      --btn: #f6f1ea;
      --btn-text: #13132a;
      --shadow: none;
      --sheet-bg: #1e1e3b;
      --scrim: rgba(5, 5, 20, 0.6);
      --ink: #f6f1ea;
      --mouth: #f6f1ea;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  html, body { margin: 0; color: var(--text); }
  body {
    font-family: "Nunito", ui-rounded, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    min-height: 100dvh;
    overscroll-behavior-y: none;
    font-feature-settings: "tnum" 1;
  }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
  input { font: inherit; color: inherit; }

  /* ---------- Face zone (fixed behind the cards) ---------- */
  .fz {
    position: fixed; top: 0; left: 0; right: 0; height: var(--fz-h); z-index: 0;
    overflow: hidden; background: var(--bg);
  }
  .face-wrap {
    position: absolute; left: 0; right: 0; top: env(safe-area-inset-top); bottom: 28px;
    display: grid; place-items: center; will-change: transform, opacity;
  }
  .face-hit { position: relative; height: min(132px, 88%); aspect-ratio: 200 / 124; cursor: pointer; }
  .face { width: 100%; height: 100%; overflow: visible; display: block; }

  .avatar {
    position: absolute; top: calc(env(safe-area-inset-top) + 10px); right: 16px; z-index: 2;
    width: 40px; height: 40px; border-radius: 50%;
    display: grid; place-items: center;
    font-weight: 800; font-size: 16px; color: var(--text);
    background: var(--card); box-shadow: var(--shadow);
    transition: transform .2s ease;
  }
  .avatar:active { transform: scale(0.92); }

  /* Face parts. data-eyes / data-mouth on the svg pick which shapes show. */
  .face .body { transform-box: view-box; transform-origin: 50% 60%; animation: bob 5s ease-in-out infinite; }
  .night .face .body { animation: breathe 4.5s ease-in-out infinite; }
  .face.bounce .body { animation: hop .5s cubic-bezier(.3, 1.6, .5, 1); }
  @keyframes bob { 50% { transform: translateY(-2.5px); } }
  @keyframes breathe { 50% { transform: translateY(1.5px) scale(1.03); } }
  @keyframes hop { 40% { transform: translateY(-7px) scale(1.04, .97); } 70% { transform: translateY(1px) scale(.98, 1.02); } }

  .face .white { fill: #fff; }
  .face .pupil { fill: #1e1b18; transition: transform .28s cubic-bezier(.3, .7, .2, 1); }
  .face .open { transform-box: fill-box; transform-origin: 50% 50%; transition: transform .14s ease, opacity .14s ease; }
  .face .shut, .face .happy, .face .line { fill: none; stroke: var(--ink); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
  .face .shut, .face .happy { opacity: 0; transition: opacity .15s ease; }
  .face[data-eyes=closed] .open, .face[data-eyes=happy] .open,
  .face[data-eyes=wink] .R .open, .face[data-eyes=peek] .R .open { transform: scaleY(.05); opacity: 0; }
  .face[data-eyes=closed] .shut, .face[data-eyes=peek] .R .shut,
  .face[data-eyes=happy] .happy, .face[data-eyes=wink] .R .happy { opacity: 1; }
  .face[data-eyes=peek] .L .open { transform: scaleY(.5); }
  .face[data-eyes=wide] .open { transform: scale(1.12); }
  .face.blink[data-eyes=open] .open, .face.blink[data-eyes=wide] .open { transform: scaleY(.06); }

  .face .m { opacity: 0; transform-box: fill-box; transform-origin: 50% 30%; transform: scale(.5); transition: opacity .15s ease, transform .22s cubic-bezier(.3, 1.4, .5, 1); }
  .face .fill { fill: var(--mouth); }
  .face .tongue { fill: var(--tongue); }
  .face[data-mouth=smile] .smile, .face[data-mouth=laugh] .laugh, .face[data-mouth=o] .o,
  .face[data-mouth=yawn] .yawn, .face[data-mouth=blep] .blep, .face[data-mouth=chew] .chew,
  .face[data-mouth=sleep] .sleep { opacity: 1; transform: none; }
  .face[data-mouth=chew] .chew { animation: chew .3s ease-in-out infinite alternate; }
  .face[data-mouth=yawn] .yawn { animation: yawn 1.4s ease-in-out; }
  .night .face[data-mouth=sleep] .sleep { animation: snore 4.5s ease-in-out infinite; }
  .face .sleep { fill: var(--ink); }
  @keyframes chew { from { transform: scaleY(.35); } to { transform: scaleY(1); } }
  @keyframes yawn { 0% { transform: scale(.4); } 60% { transform: scale(1.1, 1.2); } 100% { transform: scale(1); } }
  @keyframes snore { 50% { transform: scale(1.35); } }

  .face.dizzy .pupil { animation: dizzy .45s linear infinite; }
  @keyframes dizzy {
    0% { transform: translate(9px, 0); } 25% { transform: translate(0, 9px); }
    50% { transform: translate(-9px, 0); } 75% { transform: translate(0, -9px); } 100% { transform: translate(9px, 0); }
  }

  .zzz { position: absolute; right: -14px; top: -6px; width: 30px; height: 50px; pointer-events: none; }
  .zzz span {
    position: absolute; left: 0; bottom: 0; font-weight: 900; color: var(--ink); opacity: 0;
    font-size: 15px;
  }
  .zzz span:nth-child(2) { font-size: 19px; }
  .zzz span:nth-child(3) { font-size: 24px; }
  .snoozing .zzz span { animation: zfloat 3.6s ease-in infinite; }
  .snoozing .zzz span:nth-child(2) { animation-delay: 1.2s; }
  .snoozing .zzz span:nth-child(3) { animation-delay: 2.4s; }
  @keyframes zfloat {
    0% { opacity: 0; transform: translate(0, 0) rotate(-8deg); }
    20% { opacity: .9; }
    100% { opacity: 0; transform: translate(18px, -42px) rotate(8deg); }
  }

  /* The cards live on a panel that slides up over the face */
  .app {
    position: relative; z-index: 1;
    max-width: 480px;
    margin: calc(var(--fz-h) - 28px) auto 0;
    padding: 14px 16px calc(env(safe-area-inset-bottom) + 40px);
    background: var(--bg);
    border-radius: 32px 32px 0 0;
    min-height: calc(100vh - var(--fz-h) + 28px);
  }
  .app::after { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 100vh; background: var(--bg); }

  /* ---------- Hero ---------- */
  .hero {
    position: relative; overflow: hidden;
    border-radius: 28px; padding: 22px 20px 20px;
    background: var(--card); box-shadow: var(--shadow);
    isolation: isolate;
  }
  .hero::before {
    content: ""; position: absolute; inset: -40% -20% auto auto;
    width: 280px; height: 280px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 138, 61, 0.16), transparent 65%);
    z-index: -1; transition: background .6s ease, transform .8s ease;
  }
  .hero.sleeping::before {
    background: radial-gradient(circle, rgba(106, 98, 224, 0.30), transparent 65%);
    transform: scale(1.25);
  }
  .status { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--nap); position: relative; }
  .sleeping .dot { background: var(--night-2); }
  .sleeping .dot::after {
    content: ""; position: absolute; inset: -4px; border-radius: 50%;
    border: 2px solid var(--night-2); opacity: 0; animation: ping 2s ease-out infinite;
  }
  @keyframes ping { 0% { transform: scale(.5); opacity: .8; } 100% { transform: scale(1.8); opacity: 0; } }
  .timer {
    font-size: 54px; font-weight: 800; letter-spacing: -0.01em; line-height: 1;
    margin: 14px 0 6px; font-variant-numeric: tabular-nums;
  }
  .timer small { font-size: 26px; letter-spacing: -0.01em; color: var(--muted); font-weight: 700; }
  .timer .sec { color: var(--faint); }
  .sub { font-size: 14px; color: var(--muted); min-height: 20px; }
  .sub button { color: var(--night); font-weight: 700; }
  @media (prefers-color-scheme: dark) { .sub button { color: var(--night-2); } }

  .main-btn {
    margin-top: 20px; width: 100%; height: 58px; border-radius: 999px;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    background: var(--night); color: #fff;
    box-shadow: 0 10px 22px -12px var(--night);
    font-size: 17px; font-weight: 750; letter-spacing: -0.01em;
    transition: transform .15s ease, background .3s ease;
  }
  .main-btn:active { transform: scale(0.97); }
  .main-btn svg { width: 20px; height: 20px; }
  .sleeping .main-btn { background: var(--sun); box-shadow: 0 10px 22px -12px var(--sun); }

  /* ---------- Stat tiles ---------- */
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
  .tile { background: var(--card); border-radius: 20px; padding: 14px 14px 13px; box-shadow: var(--shadow); }
  .tile .label { font-size: 12px; color: var(--muted); font-weight: 600; }
  .tile .val { font-size: 20px; font-weight: 800; letter-spacing: -0.01em; margin-top: 6px; white-space: nowrap; }
  .tile .val span { font-size: 13px; color: var(--muted); font-weight: 700; letter-spacing: 0; margin-left: 1px; }

  /* ---------- Section ---------- */
  .card { background: var(--card); border-radius: var(--radius); padding: 20px; margin-top: 12px; box-shadow: var(--shadow); }
  .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .card-head > div:first-child { min-width: 0; }
  .eyebrow { font-size: 13px; color: var(--muted); font-weight: 600; }
  .big { font-size: 32px; font-weight: 800; letter-spacing: -0.01em; margin-top: 4px; line-height: 1.1; }
  .big span { font-size: 18px; color: var(--muted); font-weight: 700; letter-spacing: -0.01em; }
  .delta { font-size: 13px; font-weight: 700; margin-top: 4px; color: var(--muted); min-height: 18px; }
  .delta.up { color: var(--good); }

  .seg { display: inline-flex; background: var(--card-2); border-radius: 12px; padding: 3px; position: relative; flex-shrink: 0; }
  .seg button { position: relative; z-index: 1; font-size: 13px; font-weight: 700; padding: 7px 11px; border-radius: 9px; color: var(--muted); transition: color .2s; }
  .seg button.on { color: var(--text); }
  .seg .thumb { position: absolute; top: 3px; bottom: 3px; border-radius: 9px; background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.12); transition: left .3s cubic-bezier(.3,.7,.2,1), width .3s cubic-bezier(.3,.7,.2,1); }
  @media (prefers-color-scheme: dark) { .seg .thumb { background: #3a3a66; } }

  /* ---------- Chart ---------- */
  .chart { position: relative; height: 190px; margin-top: 22px; padding-right: 30px; }
  .grid { position: absolute; inset: 0 0 22px 0; pointer-events: none; }
  .gl { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--line); }
  .gl b { position: absolute; right: 0; top: -8px; font-size: 10px; font-weight: 700; color: var(--faint); }
  .avg-line { position: absolute; left: 0; right: 30px; border-top: 1.5px dashed var(--muted); opacity: .45; transition: bottom .5s cubic-bezier(.3,.7,.2,1); }
  .bars { position: absolute; inset: 0 30px 0 0; display: flex; align-items: flex-end; gap: var(--gap, 8px); }
  .col { flex: 1; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; min-width: 0; }
  .stack { width: 100%; max-width: 30px; height: calc(100% - 22px); display: flex; flex-direction: column; justify-content: flex-end; transition: opacity .25s; }
  .seg-nap, .seg-night {
    width: 100%; transform-origin: bottom; transition: height .55s cubic-bezier(.3,.7,.2,1);
  }
  .seg-nap { background: var(--nap); border-radius: 6px 6px 2px 2px; margin-bottom: 2px; }
  .seg-night { background: var(--night); border-radius: 6px 6px 3px 3px; }
  .seg-nap.empty { margin-bottom: 0; }
  .col.today .seg-night { background: repeating-linear-gradient(-45deg, var(--night), var(--night) 4px, var(--night-2) 4px, var(--night-2) 8px); }
  .col.today .seg-nap { background: repeating-linear-gradient(-45deg, var(--nap), var(--nap) 4px, var(--nap-2) 4px, var(--nap-2) 8px); }
  .bars.has-sel .col:not(.sel) .stack { opacity: .3; }
  .xl { height: 22px; line-height: 22px; font-size: 11px; font-weight: 700; color: var(--faint); white-space: nowrap; }
  .col.sel .xl { color: var(--text); }
  .legend { display: flex; gap: 16px; margin-top: 14px; font-size: 12px; color: var(--muted); font-weight: 600; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 3px; margin-right: 6px; vertical-align: 0; }

  /* ---------- History ---------- */
  .list-head { display: flex; align-items: center; justify-content: space-between; margin: 26px 4px 8px; }
  .list-head h2 { font-size: 20px; font-weight: 800; letter-spacing: -0.01em; margin: 0; }
  .pill-btn { font-size: 14px; font-weight: 700; padding: 8px 14px; border-radius: 999px; background: var(--card); box-shadow: var(--shadow); display: inline-flex; align-items: center; gap: 6px; }
  .pill-btn:active { transform: scale(.96); }
  .day { margin-top: 12px; background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .day-h { display: flex; justify-content: space-between; padding: 14px 18px 4px; font-size: 13px; color: var(--muted); font-weight: 700; }
  .row { display: flex; align-items: center; gap: 14px; padding: 12px 18px; width: 100%; text-align: left; transition: background .15s; }
  .row:active { background: var(--card-2); }
  .ico { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0; }
  .ico svg { width: 19px; height: 19px; }
  .ico.night { background: rgba(108, 92, 231, 0.14); color: var(--night); }
  .ico.nap { background: rgba(255, 181, 71, 0.18); color: #e8930c; }
  @media (prefers-color-scheme: dark) { .ico.night { color: var(--night-2); } .ico.nap { color: var(--nap); } }
  .row .mid { flex: 1; min-width: 0; }
  .row .t1 { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
  .row .t2 { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .row .dur { font-size: 16px; font-weight: 750; letter-spacing: -0.01em; }
  .row .dur.live { color: var(--night); }
  @media (prefers-color-scheme: dark) { .row .dur.live { color: var(--night-2); } }
  .empty-state { text-align: center; color: var(--muted); font-size: 14px; padding: 34px 20px; background: var(--card); border-radius: var(--radius); margin-top: 12px; box-shadow: var(--shadow); }
  .empty-state .moon { font-size: 34px; margin-bottom: 8px; }
  .more { display: block; margin: 14px auto 0; color: var(--muted); font-weight: 700; font-size: 14px; padding: 8px 14px; }

  /* ---------- Sheet ---------- */
  .scrim { position: fixed; inset: 0; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity .3s ease; z-index: 20; -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 21;
    max-width: 480px; margin: 0 auto;
    background: var(--sheet-bg); border-radius: 32px 32px 0 0;
    padding: 10px 20px calc(env(safe-area-inset-bottom) + 20px);
    transform: translateY(105%); transition: transform .38s cubic-bezier(.3,.7,.2,1);
    max-height: 90vh; overflow-y: auto;
  }
  .sheet.open { transform: translateY(0); }
  .grab { width: 38px; height: 5px; border-radius: 3px; background: var(--faint); opacity: .5; margin: 0 auto 16px; }
  .sheet h3 { font-size: 22px; font-weight: 800; letter-spacing: -0.01em; margin: 0 0 4px; }
  .sheet p.hint { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
  .field { background: var(--card-2); border-radius: 16px; padding: 10px 14px; margin-bottom: 10px; display: block; }
  .field span { display: block; font-size: 12px; color: var(--muted); font-weight: 700; }
  .field input { width: 100%; border: 0; background: transparent; outline: none; font-size: 17px; font-weight: 700; padding: 4px 0 2px; min-height: 30px; }
  .field input::-webkit-date-and-time-value { text-align: left; }
  .preview { text-align: center; font-size: 14px; color: var(--muted); margin: 6px 0 14px; min-height: 20px; }
  .preview b { color: var(--text); }
  .preview.bad b { color: var(--danger); }
  .btn { width: 100%; height: 56px; border-radius: 999px; font-size: 17px; font-weight: 750; background: var(--btn); color: var(--btn-text); transition: transform .15s, opacity .2s; }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .35; }
  .btn.ghost { background: transparent; color: var(--danger); margin-top: 6px; }
  .btn.soft { background: var(--card-2); color: var(--text); margin-top: 10px; }
  .menu { background: var(--card-2); border-radius: 18px; overflow: hidden; margin: 14px 0; }
  .menu button, .menu label.mi { display: flex; align-items: center; gap: 12px; width: 100%; padding: 15px 16px; font-size: 16px; font-weight: 650; text-align: left; cursor: pointer; }
  .menu > * + * { border-top: 1px solid var(--line); }
  .menu .danger { color: var(--danger); }
  .menu svg { width: 20px; height: 20px; color: var(--muted); }
  .menu .danger svg { color: var(--danger); }
  .foot { text-align: center; font-size: 12px; color: var(--faint); margin-top: 8px; line-height: 1.5; }
  .menu .right { margin-left: auto; font-size: 14px; color: var(--muted); font-weight: 650; display: inline-flex; align-items: center; gap: 6px; }

  /* ---------- Sync ---------- */
  .avatar .badge {
    position: absolute; right: -1px; bottom: -1px; width: 13px; height: 13px; border-radius: 50%;
    border: 2.5px solid var(--bg); display: none;
  }
  .sdot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); display: inline-block; flex-shrink: 0; }
  .s-live { background: var(--good); }
  .s-wait { background: var(--nap); }
  .s-error { background: var(--danger); }
  .avatar .badge.s-live, .avatar .badge.s-wait, .avatar .badge.s-error { display: block; }
  .sync-status { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; color: var(--muted); margin: -6px 0 16px; }
  .code-card { background: var(--card-2); border-radius: 18px; padding: 16px; text-align: center; margin-bottom: 10px; }
  .code-card span { display: block; font-size: 12px; color: var(--muted); font-weight: 700; margin-bottom: 8px; }
  .code-card b { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 19px; letter-spacing: .04em; font-weight: 800; word-break: break-all; user-select: all; -webkit-user-select: all; }
  .field input.code { font-family: ui-monospace, "SF Mono", Menlo, monospace; text-transform: uppercase; letter-spacing: .04em; }
  .steps { margin: 0 0 16px; padding-left: 20px; color: var(--muted); font-size: 14px; line-height: 1.55; }
  .steps b { color: var(--text); }

  /* ---------- Feeds ---------- */
  .quick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }

  .qa small span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ico.milk { background: rgba(47, 140, 240, 0.14); color: var(--milk); }

  .chip:active { transform: scale(.95); }

  .menu .ico { width: 36px; height: 36px; }
  .menu .ico svg { width: 18px; height: 18px; color: inherit; }

  /* ---------- Timeline ---------- */
  .tl { padding: 2px 0 8px; }
  .tl-item {
    display: grid; grid-template-columns: 42px 36px 1fr auto; align-items: center; column-gap: 12px;
    width: 100%; padding: 9px 18px 9px 12px; text-align: left; position: relative; transition: background .15s;
  }
  .tl-item:active { background: var(--card-2); }
  .tl-item::before { content: ""; position: absolute; left: 83px; top: 0; bottom: 0; width: 2px; background: var(--rail); }
  .tl-item:first-child::before { top: 50%; }
  .tl-item:last-child::before { bottom: 50%; }
  .tl-item:only-child::before { display: none; }
  .tl-time { font-size: 13px; font-weight: 700; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
  .tl-item .ico { width: 36px; height: 36px; position: relative; z-index: 1; box-shadow: 0 0 0 4px var(--card); }
  .tl-item .ico svg { width: 17px; height: 17px; }
  .tl-item .ico.night { background: color-mix(in srgb, var(--night) 16%, var(--card)); }
  .tl-item .ico.nap { background: color-mix(in srgb, var(--nap) 20%, var(--card)); }
  .tl-item .ico.milk { background: color-mix(in srgb, var(--milk) 15%, var(--card)); }
  .tl-item .ico.solid { background: color-mix(in srgb, var(--solid) 16%, var(--card)); }
  .tl-item.live .ico::after { content: ""; position: absolute; inset: -3px; border-radius: 50%; border: 2px solid var(--night-2); animation: ping 2s ease-out infinite; }
  .tl-item .mid { min-width: 0; }
  .tl-item .t1 { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tl-item .t2 { font-size: 13px; color: var(--muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tl-item .dur { font-size: 15px; font-weight: 750; letter-spacing: -0.01em; white-space: nowrap; }
  .tl-item .dur.live { color: var(--night); }
  @media (prefers-color-scheme: dark) { .tl-item .dur.live { color: var(--night-2); } }

  /* ---------- Toast ---------- */

    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 20px); z-index: 30;
    transform: translate(-50%, calc(100% + 60px)); opacity: 0; transition: transform .35s cubic-bezier(.3,.7,.2,1), opacity .25s;

<script>
(() => {
  'use strict';

  // ---------- Storage ----------
  const KEY = 'sleeptracker.v1';
  const DAY_START_HOUR = 7;   // a "sleep day" runs 7am -> 7am
  const NIGHT_START_HOUR = 19; // 7pm -> 7am counts as night

  let state = load();

  // Feeds: { id, at, type: 'milk' | 'solid', ml, what, updatedAt }.
  // state.tomb / state.ftomb remember deleted sleep / feed ids so deletions reach the other phone.
  // state.dirty holds changes not yet sent to the sync server.
  function load() {
    const blank = { name: 'Sye', nameAt: 0, sleeps: [], feeds: [], active: null, activeAt: 0, tomb: {}, ftomb: {}, dirty: {}, family: null };
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const s = JSON.parse(raw);
        const sleeps = (Array.isArray(s.sleeps) ? s.sleeps : []).map(x => ({ ...x, updatedAt: x.updatedAt || x.end }));
        const feeds = (Array.isArray(s.feeds) ? s.feeds : []).map(x => ({ ...x, updatedAt: x.updatedAt || x.at }));
        return { ...blank, ...s, name: s.name || 'Sye', sleeps, feeds, tomb: s.tomb || {}, ftomb: s.ftomb || {}, dirty: s.dirty || {} };
      }
    } catch (e) {}
    return blank;
  }
  function saveLocal() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }
  function save() {
    saveLocal();
    Sync.push();
  }

  // ---------- Changes (all edits go through these so sync sees them) ----------
  const COLLS = { sleeps: { prefix: 's:', tomb: 'tomb' }, feeds: { prefix: 'f:', tomb: 'ftomb' } };
  function touch(coll, x) {
    x.updatedAt = Date.now();
    delete state[COLLS[coll].tomb][x.id];
    state.dirty[COLLS[coll].prefix + x.id] = 1;
  }
  function addEntry(coll, x) {
    state[coll].push(x);
    touch(coll, x);
    return x;
  }
  function removeEntry(coll, id) {
    const i = state[coll].findIndex(x => x.id === id);
    if (i < 0) return null;
    const [gone] = state[coll].splice(i, 1);
    state[COLLS[coll].tomb][id] = Date.now();
    state.dirty[COLLS[coll].prefix + id] = 1;
    return gone;
  }
  function restoreEntry(coll, x) {
    if (state[coll].some(y => y.id === x.id)) return;
    addEntry(coll, x);
  }
  function setActive(v) {
    state.active = v;
    state.activeAt = Date.now();
    state.dirty.active = 1;
  }
  function setName(n) {
    state.name = n;
    state.nameAt = Date.now();
    state.dirty.name = 1;
  }
  // Ask the browser to never evict our data.
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}

  // ---------- Helpers ----------
  const $ = (id) => document.getElementById(id);
  const MIN = 60000, HOUR = 3600000;
  const pad = (n) => String(n).padStart(2, '0');
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const buzz = (ms = 10) => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

  function fmtDur(ms, html) {
    const m = Math.max(0, Math.round(ms / MIN));
    const h = Math.floor(m / 60), r = m % 60;
    if (!html) return h ? (r ? `${h}h ${r}m` : `${h}h`) : `${r}m`;
    if (!h) return `${r}<span>m</span>`;
    return r ? `${h}<span>h</span> ${r}<span>m</span>` : `${h}<span>h</span>`;
  }
  function fmtTime(t) {
    const d = new Date(t);
    return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }
  function dayKey(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
  function keyToDate(k) { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); }
  function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function at(d, h) { const x = new Date(d); x.setHours(h, 0, 0, 0); return x.getTime(); }

  // The sleep-day a moment belongs to (before 7am counts as the previous day).
  function sleepDayOf(t) {
    const d = new Date(t);
    return dayKey(d.getHours() < DAY_START_HOUR ? addDays(d, -1) : d);
  }

  // Split an interval into {key, night, ms} chunks on 7am / 7pm boundaries.
  function split(s, e) {
    const out = [];
    let t = s;
    while (t < e) {
      const d = new Date(t), h = d.getHours();
      let next, night, key;
      if (h < DAY_START_HOUR) { next = at(d, DAY_START_HOUR); night = true; key = dayKey(addDays(d, -1)); }
      else if (h < NIGHT_START_HOUR) { next = at(d, NIGHT_START_HOUR); night = false; key = dayKey(d); }
      else { next = at(addDays(d, 1), DAY_START_HOUR); night = true; key = dayKey(d); }
      if (next <= t) next = t + HOUR; // DST safety
      const end = Math.min(next, e);
      out.push({ key, night, ms: end - t });
      t = end;
    }
    return out;
  }
  function isNight(s, e) {
    let n = 0, d = 0;
    for (const c of split(s, e)) c.night ? (n += c.ms) : (d += c.ms);
    return n > 0 && n >= d;
  }

  function allSleeps(now) {
    const list = state.sleeps.slice();
    if (state.active) list.push({ id: 'active', start: state.active, end: now, live: true });
    return list;
  }

  function totalsByDay(now) {
    const map = {};
    for (const s of allSleeps(now)) {
      for (const c of split(s.start, s.end)) {
        const m = map[c.key] || (map[c.key] = { night: 0, nap: 0 });
        c.night ? (m.night += c.ms) : (m.nap += c.ms);
      }
    }
    return map;
  }

  // ---------- Face ----------
  // The little character at the top. It sleeps while the baby sleeps and is awake and curious
  // otherwise: it blinks, glances around, looks where you tap and reacts to what you log.
  const Face = (() => {
    const svg = $('face'), hit = $('faceHit'), wrap = $('faceWrap'), fz = $('fz');
    const pupils = [...svg.querySelectorAll('.pupil')];
    const EYES = [[62, 54], [138, 54]], VBW = 200, VBH = 124, REACH = 11;
    const EXPR = {
      awake: { eyes: 'open', mouth: 'smile' },
      asleep: { eyes: 'closed', mouth: 'sleep' },
      peek: { eyes: 'peek', mouth: 'sleep' },
      yawn: { eyes: 'happy', mouth: 'yawn' },
      happy: { eyes: 'happy', mouth: 'laugh', bounce: true },
      giggle: { eyes: 'happy', mouth: 'laugh', bounce: true },
      wink: { eyes: 'wink', mouth: 'blep' },
      blep: { eyes: 'open', mouth: 'blep' },
      content: { eyes: 'happy', mouth: 'smile' },
      yum: { eyes: 'happy', mouth: 'chew' },
      surprised: { eyes: 'wide', mouth: 'o' },
      dizzy: { eyes: 'open', mouth: 'o', dizzy: true }
    };
    const SLEEPY = new Set(['asleep', 'peek']);
    let sleeping = null, playing = false, stepTimer = null, holdUntil = 0, taps = [], turn = 0, dizzyUntil = 0;

    function apply(name) {
      const e = EXPR[name];
      svg.dataset.eyes = e.eyes;
      svg.dataset.mouth = e.mouth;
      svg.classList.toggle('dizzy', !!e.dizzy);
      fz.classList.toggle('snoozing', name === 'asleep');
      if (e.bounce) { svg.classList.remove('bounce'); void svg.getBoundingClientRect(); svg.classList.add('bounce'); }
    }
    const rest = () => (sleeping ? 'asleep' : 'awake');

    // Plays [expression, ms] steps, then settles back to awake / asleep.
    // While the baby sleeps only sleepy expressions play, unless forced (waking up).
    function play(steps, force) {
      if (sleeping && !force && steps.some(([n]) => !SLEEPY.has(n))) return;
      clearTimeout(stepTimer);
      playing = true;
      let i = 0;
      (function next() {
        if (i >= steps.length) { playing = false; apply(rest()); return; }
        const [name, ms] = steps[i++];
        apply(name);
        stepTimer = setTimeout(next, ms);
      })();
    }
    // For reactions after a sheet closes, so the face is in view.
    const later = (steps, ms = 220) => setTimeout(() => play(steps), ms);

    function setSleeping(v) {
      if (v === sleeping) return;
      sleeping = v;
      document.documentElement.classList.toggle('night', v);
      if (!playing) apply(rest());
    }

    function setPupils(offsets) {
      pupils.forEach((p, i) => { p.style.transform = `translate(${offsets[i][0].toFixed(1)}px, ${offsets[i][1].toFixed(1)}px)`; });
    }
    function restGaze() {
      if (Date.now() < holdUntil) return;
      const down = 5 + 5 * Math.min(1, Math.max(0, scrollY) / 240); // looks down at the cards, more as you scroll
      setPupils([[0, down], [0, down]]);
    }
    function lookAt(x, y, ms = 1600) {
      const r = svg.getBoundingClientRect();
      if (!r.width) return;
      setPupils(EYES.map(([ex, ey]) => {
        const dx = x - (r.left + ex / VBW * r.width), dy = y - (r.top + ey / VBH * r.height);
        const d = Math.hypot(dx, dy) || 1, k = REACH * Math.min(1, d / 140);
        return [dx / d * k, dy / d * k];
      }));
      holdUntil = Date.now() + ms;
      setTimeout(restGaze, ms + 20);
    }
    function blink(twice) {
      svg.classList.add('blink');
      setTimeout(() => { svg.classList.remove('blink'); if (twice) setTimeout(() => blink(false), 140); }, 120);
    }
    (function blinkLoop() {
      setTimeout(() => {
        if (!document.hidden && /^(open|wide)$/.test(svg.dataset.eyes)) blink(Math.random() < 0.2);
        blinkLoop();
      }, 2400 + Math.random() * 3600);
    })();
    (function glanceLoop() {
      setTimeout(() => {
        if (!sleeping && !playing && !document.hidden && Date.now() > holdUntil + 3000) {
          const r = svg.getBoundingClientRect();
          const [sx, sy] = [[-1, 0.2], [1, 0.2], [-0.7, -0.6], [0.7, -0.6]][Math.floor(Math.random() * 4)];
          lookAt(r.left + r.width / 2 + sx * 300, r.top + r.height / 2 + sy * 300, 1100);
        }
        glanceLoop();
      }, 6000 + Math.random() * 7000);
    })();

    function tapFace() {
      const now = Date.now();
      if (now < dizzyUntil) return; // let the dizzy spin finish
      taps = taps.filter(t => now - t < 2500).concat(now);
      buzz(8);
      if (sleeping) return play([['peek', 900]]);
      if (taps.length >= 5) { taps = []; dizzyUntil = now + 1500; return play([['dizzy', 1500], ['giggle', 800]]); }
      play([[['giggle', 'wink', 'blep'][turn++ % 3], 1200]]);
    }
    document.addEventListener('pointerdown', e => {
      if (hit.contains(e.target)) tapFace();
      else if (!sleeping) lookAt(e.clientX, e.clientY);
    }, { capture: true, passive: true });

    // The face drifts up and shrinks a little as the cards slide over it.
    let ticking = false;
    addEventListener('scroll', () => {
      if (ticking) return;

      requestAnimationFrame(() => {

        restGaze();
      });
    }, { passive: true });

    restGaze();
    return { setSleeping, play, later, lookAt };
  })();

  // ---------- Hero ----------
  const ICON_MOON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 14.3A8.5 8.5 0 0 1 9.7 3.5a.6.6 0 0 0-.8-.7A9.5 9.5 0 1 0 21.2 15.1a.6.6 0 0 0-.7-.8Z"/></svg>';

  // ---------- Chart ----------
  let range = 7, selected = null;

  function chartDays(now) {
    const end = keyToDate(sleepDayOf(now));
    const days = [];
    for (let i = range - 1; i >= 0; i--) days.push(dayKey(addDays(end, -i)));
    return days;
  }

  function renderChart(now, totals) {
    const days = chartDays(now);
    const today = days[days.length - 1];
    const vals = days.map(k => ({ k, ...(totals[k] || { night: 0, nap: 0 }) }));
    const sum = v => v.night + v.nap;
    const max = Math.max(4 * HOUR, ...vals.map(sum));
    const step = max > 12 * HOUR ? 6 * HOUR : max > 6 * HOUR ? 4 * HOUR : 2 * HOUR;
    const top = Math.ceil(max / step) * step;

    // Average over finished days that have data; fall back to today.
    const done = vals.filter(v => v.k !== today && sum(v) > 0);
    const pool = done.length ? done : vals.filter(v => sum(v) > 0);
    const avg = pool.length ? pool.reduce((a, v) => a + sum(v), 0) / pool.length : 0;

    // grid
    const grid = $('grid');
    let g = '';
    for (let y = 0; y <= top; y += step) {
      g += `<div class="gl" style="bottom:${(y / top) * 100}%"><b>${y / HOUR}h</b></div>`;
    }
    if (avg) g += `<div class="avg-line" style="bottom:${(avg / top) * 100}%"></div>`;
    grid.innerHTML = g;

    // bars — reuse nodes so heights animate
    const bars = $('bars');
    bars.style.setProperty('--gap', range === 7 ? '12px' : range === 14 ? '6px' : '3px');
    if (bars.children.length !== vals.length) {
      bars.innerHTML = vals.map(() => '<div class="col"><div class="stack"><div class="seg-nap" style="height:0"></div><div class="seg-night" style="height:0"></div></div><div class="xl"></div></div>').join('');
      [...bars.children].forEach((c, i) => c.addEventListener('click', () => {
        selected = selected === i ? null : i; buzz(6); renderChart(Date.now(), totalsByDay(Date.now()));
      }));
    }
    const labelEvery = range === 7 ? 1 : range === 14 ? 2 : 5;
    vals.forEach((v, i) => {
      const col = bars.children[i];
      col.classList.toggle('today', v.k === today);
      col.classList.toggle('sel', selected === i);
      const nap = col.querySelector('.seg-nap'), night = col.querySelector('.seg-night');
      requestAnimationFrame(() => {
        night.style.height = `${(v.night / top) * 100}%`;
        nap.style.height = `${(v.nap / top) * 100}%`;
      });
      nap.classList.toggle('empty', v.nap === 0 || v.night === 0);
      const d = keyToDate(v.k);
      const fromEnd = vals.length - 1 - i;
      col.querySelector('.xl').textContent = range === 7 ? WD[d.getDay()] : (fromEnd % labelEvery === 0 ? d.getDate() : '');
    });
    bars.classList.toggle('has-sel', selected != null);

    // header
    if (selected != null && vals[selected]) {
      const v = vals[selected], d = keyToDate(v.k);
      $('chartEyebrow').textContent = v.k === today ? 'Today so far' : `${WDL[d.getDay()]}, ${d.getDate()} ${MON[d.getMonth()]}`;
      $('chartBig').innerHTML = fmtDur(sum(v), true);
      $('chartDelta').className = 'delta';
      $('chartDelta').textContent = sum(v) ? `${fmtDur(v.night)} night · ${fmtDur(v.nap)} naps` : 'No sleep logged';
    } else {
      $('chartEyebrow').textContent = `Daily average · ${range} days`;
      $('chartBig').innerHTML = avg ? fmtDur(avg, true) : '0<span>h</span>';
      // Compare to the previous period of the same length
      const prevEnd = addDays(keyToDate(days[0]), -1);
      let pSum = 0, pN = 0;
      for (let i = 0; i < range; i++) {
        const t = totals[dayKey(addDays(prevEnd, -i))];
        if (t && t.night + t.nap > 0) { pSum += t.night + t.nap; pN++; }
      }
      const el = $('chartDelta');
      if (avg && pN) {
        const diff = avg - pSum / pN;
        el.className = 'delta' + (diff > 0 ? ' up' : '');
        el.textContent = Math.abs(diff) < MIN ? 'Same as previous period' : `${diff > 0 ? '▲' : '▼'} ${fmtDur(Math.abs(diff))} vs last ${range}d`;

      }
    }
  }

  const ICON_BOTTLE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2h4M10.5 2v3M13.5 2v3M9 5h6l1.2 3.2V19a3 3 0 0 1-3 3h-2.4a3 3 0 0 1-3-3V8.2Z"/><path d="M8.5 12H12M8.5 16H12"/></svg>';

  const DRINKS = ['Milk', 'Formula', 'Water'];

  // Checks a feed from a backup or the other phone; returns a clean copy or null.
  function cleanFeed(f) {
    if (!f || typeof f.at !== 'number' || (f.type !== 'milk' && f.type !== 'solid')) return null;
    const ml = typeof f.ml === 'number' && f.ml > 0 && f.ml <= 2000 ? Math.round(f.ml) : null;
    return { id: String(f.id || uid()), at: f.at, type: f.type, ml: f.type === 'milk' ? ml : null, what: typeof f.what === 'string' ? f.what.slice(0, 160) : '' };
  }
  function parseFoods(text) {
    const out = [];
    for (const raw of String(text || '').split(/[,\n;]+/)) {
      const t = raw.trim().replace(/\s+/g, ' ').slice(0, 30);
      if (!t) continue;
      const nice = t[0].toUpperCase() + t.slice(1);
      if (!out.some(x => x.toLowerCase() === nice.toLowerCase())) out.push(nice);
    }
    return out.slice(0, 8);
  }

    const map = {};

  // ---------- Timeline ----------
  let showDays = 7;
  function relDay(k, now) {
    const today = sleepDayOf(now);
    if (k === today) return 'Today';
    if (k === dayKey(addDays(keyToDate(today), -1))) return 'Yesterday';
    const d = keyToDate(k);
    return `${WDL[d.getDay()].slice(0, 3)}, ${d.getDate()} ${MON[d.getMonth()]}`;
  }
  function renderHistory(now, totals, ftotals) {
    const items = [
      ...allSleeps(now).map(s => ({ kind: 'sleep', t: s.start, x: s })),
      ...state.feeds.map(f => ({ kind: 'feed', t: f.at, x: f }))
    ].sort((a, b) => b.t - a.t);
    const el = $('history');
    if (!items.length) {
      el.innerHTML = `<div class="empty-state"><div class="moon">🌙</div>Nothing logged yet.<br>Tap <b>Start sleep</b>, <b>Liquids</b> or <b>Solids</b> above,<br>or <b>Add</b> something you missed.</div>`;
      return;
    }
    // time since the previous drink, shown under each drink
    const gap = {};
    state.feeds.filter(f => f.type === 'milk').sort((a, b) => a.at - b.at)
      .forEach((f, i, a) => { if (i && f.at - a[i - 1].at < 24 * HOUR) gap[f.id] = f.at - a[i - 1].at; });

    const groups = new Map();
    for (const it of items) {
      const k = sleepDayOf(it.t);
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(it);
    }
    let html = '', n = 0;
    for (const [k, list] of groups) {
      if (n++ >= showDays) break;
      const t = totals[k] || { night: 0, nap: 0 }, ft = ftotals[k] || { ml: 0, meals: 0 };
      const sum = [];
      if (t.night + t.nap) sum.push(`${fmtDur(t.night + t.nap)} sleep`);
      if (ft.ml) sum.push(`${ft.ml} ml`);
      if (ft.meals) sum.push(`${ft.meals} meal${ft.meals === 1 ? '' : 's'}`);
      html += `<div class="day"><div class="day-h"><span>${relDay(k, now)}</span><span>${sum.join(' · ')}</span></div><div class="tl">`;
      for (const it of list) {
        const x = it.x;
        if (it.kind === 'sleep') {
          const night = isNight(x.start, x.end);
          html += `<button class="tl-item${x.live ? ' live' : ''}" data-sleep="${x.id}">
            <div class="tl-time">${fmtTime(x.start)}</div>
            <div class="ico ${night ? 'night' : 'nap'}">${night ? ICON_MOON : ICON_SUN}</div>
            <div class="mid"><div class="t1">${night ? 'Night sleep' : 'Nap'}</div>
            <div class="t2">${x.live ? 'Sleeping now' : `Woke at ${fmtTime(x.end)}`}</div></div>
            <div class="dur${x.live ? ' live' : ''}">${fmtDur(x.end - x.start)}</div>
          </button>`;
        } else {
          const milk = x.type === 'milk';
          const t2 = milk ? (gap[x.id] ? `${fmtDur(gap[x.id])} after last drink` : 'Drink') : 'Solids';
          html += `<button class="tl-item" data-feed-id="${x.id}">
            <div class="tl-time">${fmtTime(x.at)}</div>
            <div class="ico ${milk ? 'milk' : 'solid'}">${milk ? ICON_BOTTLE : ICON_BOWL}</div>
            <div class="mid"><div class="t1">${escapeHtml(feedLabel(x))}</div><div class="t2">${t2}</div></div>
            <div class="dur">${milk && x.ml ? `${x.ml} ml` : ''}</div>
          </button>`;
        }
      }
      html += '</div></div>';
    }
    if (groups.size > showDays) html += `<button class="more" id="moreBtn">Show more</button>`;
    el.innerHTML = html;
    el.querySelectorAll('[data-sleep]').forEach(r => r.addEventListener('click', () => openEdit(r.dataset.sleep)));
    el.querySelectorAll('[data-feed-id]').forEach(r => r.addEventListener('click', () => openFeed(null, r.dataset.feedId)));
    const more = $('moreBtn');
    if (more) more.onclick = () => { showDays += 14; renderAll(); };
  }

  let editing = null; // null = new, 'active' = running sleep, else id

  function readEdit() {

  function updatePreview() {

    else if (e <= s) { ok = false; msg = '<b>Wake-up must be after falling asleep</b>'; }
    else if (e - s > 24 * HOUR) { ok = false; msg = '<b>That’s longer than 24 hours</b>'; }
    else msg = editing === 'active' ? `Asleep for <b>${fmtDur(e - s)}</b> so far` : `<b>${fmtDur(e - s)}</b> · ${isNight(s, e) ? 'night sleep' : 'nap'}`;

  $('importInput').addEventListener('change', async (ev) => {

        .filter(s => s && typeof s.start === 'number' && typeof s.end === 'number' && s.end > s.start)
        .map(s => ({ id: String(s.id || uid()), start: s.start, end: s.end }));

      const seen = new Set(state.sleeps.map(s => s.start + ':' + s.end));

  $('wipeBtn').addEventListener('click', () => {

  // ---------- Toast ----------
  let toastTimer;

    $('toastText').textContent = text;

  function escapeHtml(s) { return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

  // ---------- Sync ----------
  // Each phone keeps its own copy and sends changes to a shared Firebase
  // database. For every entry the most recent change wins.
  const Sync = (() => {
    const cfg = window.SYNC_CONFIG;
    let backend = null, unsub = null, status = 'off', pushing = false, again = false;
    const configured = () => !!window.__TEST_BACKEND__ || !!(cfg && cfg.projectId);

    async function getBackend() {
      if (backend) return backend;
      if (window.__TEST_BACKEND__) return (backend = window.__TEST_BACKEND__);
      const base = 'https://www.gstatic.com/firebasejs/10.12.2/';
      const [A, F] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-firestore.js')]);
      const db = F.getFirestore(A.initializeApp(cfg));
      backend = {
        listen(fid, onDocs, onState) {
          const subs = ['sleeps', 'feeds', 'meta'].map(coll => F.onSnapshot(
            F.collection(db, 'families', fid, coll),
            { includeMetadataChanges: true },
            snap => {
              onDocs(coll, snap.docChanges().map(c => ({ id: c.doc.id, data: c.doc.data() })));
              onState(snap.metadata.fromCache ? 'wait' : 'live');
            },
            err => onState('error', err)
          ));
          return () => subs.forEach(u => u());
        },
        put(fid, coll, id, data) { return F.setDoc(F.doc(db, 'families', fid, coll, id), data); }
      };
      return backend;
    }

    function setStatus(s) { status = s; renderSyncUi(); }

    async function start() {
      if (!state.family || !configured() || unsub) return;
      setStatus('wait');
      let b;
      try { b = await getBackend(); } catch (e) { console.warn('sync: could not load', e); return; } // offline; retried on 'online'
      if (unsub || !state.family) return;
      const fid = state.family;
      unsub = b.listen(fid,
        (coll, docs) => { if (fid === state.family) applyRemote(coll, docs); },
        (s, err) => { if (err) console.warn('sync', err); setStatus(s); if (s === 'live') push(); });
      push();
    }
    function stop() {
      if (unsub) unsub();
      unsub = null;
      setStatus('off');
    }

    // What to send for one pending change.
    function docFor(key) {
      if (key === 'active') return { coll: 'meta', id: 'active', data: { value: state.active || null, updatedAt: state.activeAt || 0 } };
      if (key === 'name') return { coll: 'meta', id: 'name', data: { value: state.name, updatedAt: state.nameAt || 0 } };
      const coll = key.startsWith('f:') ? 'feeds' : 'sleeps';
      const id = key.slice(2), x = state[coll].find(y => y.id === id), gone = state[COLLS[coll].tomb][id];
      if (x && coll === 'sleeps') return { coll, id, data: { start: x.start, end: x.end, updatedAt: x.updatedAt, deleted: false } };
      if (x) return { coll, id, data: { at: x.at, type: x.type, ml: x.ml ?? null, what: x.what || '', updatedAt: x.updatedAt, deleted: false } };
      if (gone) return { coll, id, data: { deleted: true, updatedAt: gone } };
      return null;
    }

    async function push() {
      if (!state.family || !backend || !unsub) return;
      if (pushing) { again = true; return; }
      pushing = true;
      try {
        do {
          again = false;
          const fid = state.family;
          const jobs = Object.keys(state.dirty).map(key => {
            const d = docFor(key);
            if (!d) { delete state.dirty[key]; return null; }
            return backend.put(fid, d.coll, d.id, d.data).then(() => {
              // Only clear it if nothing changed while it was being sent.
              const now = docFor(key);
              if (fid === state.family && now && now.data.updatedAt === d.data.updatedAt) delete state.dirty[key];
            });
          }).filter(Boolean);
          if (!jobs.length) break;
          await Promise.all(jobs);
          saveLocal();
        } while (again);
      } catch (e) {
        console.warn('sync: send failed', e);
        setStatus('error');
      } finally {
        pushing = false;
      }
    }

    function applyRemote(coll, docs) {
      let changed = false;
      for (const { id, data } of docs) {
        if (!data || typeof data.updatedAt !== 'number') continue;
        if (COLLS[coll]) {
          const list = state[coll], tomb = state[COLLS[coll].tomb];
          const i = list.findIndex(x => x.id === id);
          const localAt = i >= 0 ? list[i].updatedAt : (tomb[id] || 0);
          if (!(data.updatedAt > localAt)) continue;
          if (data.deleted) {
            if (i >= 0) list.splice(i, 1);
            tomb[id] = data.updatedAt;
          } else {
            let x;
            if (coll === 'sleeps') {
              if (typeof data.start !== 'number' || typeof data.end !== 'number') continue;
              x = { id, start: data.start, end: data.end };
            } else {
              x = cleanFeed({ ...data, id });
              if (!x) continue;
            }
            x.updatedAt = data.updatedAt;
            if (i >= 0) list[i] = x; else list.push(x);
            delete tomb[id];
          }
          delete state.dirty[COLLS[coll].prefix + id];
          changed = true;
        } else if (id === 'active' && data.updatedAt > (state.activeAt || 0)) {
          state.active = typeof data.value === 'number' ? data.value : null;
          state.activeAt = data.updatedAt;
          delete state.dirty.active;
          changed = true;
        } else if (id === 'name' && typeof data.value === 'string' && data.updatedAt > (state.nameAt || 0)) {
          state.name = data.value.slice(0, 24) || 'Sye';
          state.nameAt = data.updatedAt;
          delete state.dirty.name;
          changed = true;
        }
      }
      if (changed) { saveLocal(); renderAll(); }
    }

    // Queue everything on this phone so it gets shared when sync starts.
    function shareAll() {
      for (const coll in COLLS) {
        const { prefix, tomb } = COLLS[coll];
        for (const x of state[coll]) state.dirty[prefix + x.id] = 1;
        for (const id in state[tomb]) state.dirty[prefix + id] = 1;
      }
      if (state.activeAt) state.dirty.active = 1;
      if (state.nameAt) state.dirty.name = 1;
    }
    function begin(code) {
      stop();
      state.family = code;
      shareAll();
      saveLocal();
      start();
    }
    function leave() {
      stop();
      state.family = null;
      state.dirty = {};
      saveLocal();
    }

    window.addEventListener('online', () => { unsub ? push() : start(); });
    window.addEventListener('offline', () => { if (unsub) setStatus('wait'); });

    return { configured, start, stop, push, begin, leave, status: () => status };
  })();

  // Family codes: 20 characters (about 100 bits), shown as XXXXX-XXXXX-XXXXX-XXXXX.
  const CODE_CHARS = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  function newCode() {
    const r = crypto.getRandomValues(new Uint8Array(20));
    return Array.from(r, b => CODE_CHARS[b % CODE_CHARS.length]).join('');
  }
  const fmtCode = (c) => c.match(/.{1,5}/g).join('-');
  function parseCode(text) {
    const up = String(text || '').toUpperCase();
    const m = up.match(/[A-Z0-9]{5}-[A-Z0-9]{5}-[A-Z0-9]{5}-[A-Z0-9]{5}/);
    const raw = (m ? m[0] : up).replace(/[^A-Z0-9]/g, '');
    return raw.length === 20 && [...raw].every(ch => CODE_CHARS.includes(ch)) ? raw : null;
  }

  const SYNC_TEXT = { off: 'Off', wait: 'Connecting…', live: 'On', error: 'Problem' };
  const SYNC_CLASS = { off: '', wait: 's-wait', live: 's-live', error: 's-error' };
  function syncStatusLine() {
    const s = Sync.status();
    if (s === 'live') return 'Synced · up to date';
    if (s === 'error') return 'Can’t sync right now. Check the setup steps, then reopen the app.';
    return navigator.onLine === false ? 'Offline · changes will sync when you’re back online' : 'Connecting…';
  }
  function renderSyncUi() {
    const s = Sync.status();
    $('syncBadge').className = 'badge ' + SYNC_CLASS[s];
    $('syncRowState').innerHTML = state.family ? `<i class="sdot ${SYNC_CLASS[s]}"></i>${SYNC_TEXT[s]}` : (Sync.configured() ? 'Off' : 'Set up');
    const line = $('syncLine');
    if (line) line.innerHTML = `<i class="sdot ${SYNC_CLASS[s]}"></i>${syncStatusLine()}`;
  }

  const SETUP_URL = 'https://github.com/SlavVitanov/Sleep-tracker#sync-between-two-phones';
  function renderSyncSheet(view) {
    const body = $('syncBody');
    if (!Sync.configured()) {
      body.innerHTML = `<h3>Sync with partner</h3>
        <p class="hint">See the same log on both phones. This needs a one-time setup of about 10 minutes, done by whoever looks after the app.</p>
        <a class="btn" style="display:grid;place-items:center;text-decoration:none" href="${SETUP_URL}" target="_blank" rel="noopener">Open the setup guide</a>
        <button class="btn soft" data-act="close">Not now</button>`;
    } else if (state.family) {
      body.innerHTML = `<h3>Sync is on</h3>
        <div class="sync-status" id="syncLine"></div>
        <div class="code-card"><span>Family code</span><b>${fmtCode(state.family)}</b></div>
        <p class="hint">On your partner’s phone, open the app, tap the round initial → <b>Sync with partner</b> → <b>I have a code</b>, and paste this code. Keep it private: anyone with it can see and change the log.</p>
        <button class="btn" data-act="share">Send code to partner</button>
        <button class="btn soft" data-act="close">Done</button>
        <button class="btn ghost" data-act="leave">Stop syncing on this phone</button>`;
    } else if (view === 'join') {
      body.innerHTML = `<h3>Join your partner</h3>
        <p class="hint">On the phone that already syncs, tap the round initial → <b>Sync with partner</b> → <b>Send code to partner</b>. Then paste the code here.</p>
        <label class="field"><span>Family code</span><input class="code" id="inCode" placeholder="XXXXX-XXXXX-XXXXX-XXXXX" autocomplete="off" autocapitalize="characters" spellcheck="false"></label>
        <div class="preview" id="codeHint"></div>
        <button class="btn" data-act="join" id="joinBtn" disabled>Join</button>
        <button class="btn soft" data-act="back">Back</button>`;
      const inp = $('inCode');
      inp.addEventListener('input', () => {
        const ok = !!parseCode(inp.value);
        $('joinBtn').disabled = !ok;
        $('codeHint').innerHTML = inp.value.trim() && !ok ? 'That doesn’t look like a family code yet' : '';
      });
    } else {
      body.innerHTML = `<h3>Sync with partner</h3>
        <p class="hint">Log on either phone and see it on both, live. Everything already on this phone is kept and shared.</p>
        <button class="btn" data-act="create">Start syncing</button>
        <button class="btn soft" data-act="toJoin">I have a code from my partner</button>`;
    }
    body.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => syncAction(b.dataset.act)));
    renderSyncUi();
  }

  async function syncAction(act) {
    buzz(8);
    if (act === 'close') return hide();
    if (act === 'toJoin') return renderSyncSheet('join');
    if (act === 'back') return renderSyncSheet();
    if (act === 'create') {
      Sync.begin(newCode());
      renderSyncSheet();
      return toast('Sync is on');
    }
    if (act === 'join') {
      const code = parseCode($('inCode').value);
      if (!code) return;
      Sync.begin(code);
      renderSyncSheet();
      return toast('Joined · syncing now');
    }
    if (act === 'leave') {
      if (!confirm('Stop syncing on this phone? The log stays on this phone, but new changes won’t be shared.')) return;
      Sync.leave();
      renderSyncSheet();
      return toast('Sync turned off');
    }
    if (act === 'share') {
      const link = location.origin + location.pathname;
      const text = `Join ${state.name}'s sleep tracker:\n1. Open ${link} and add it to your home screen\n2. Open it, tap the round initial → Sync with partner → I have a code\n3. Paste this code: ${fmtCode(state.family)}`;
      try {
        if (navigator.share) { await navigator.share({ text }); return; }
      } catch (e) { if (e && e.name === 'AbortError') return; }
      try { await navigator.clipboard.writeText(text); toast('Code copied'); }
      catch (e) { toast('Copy the code above'); }
    }
  }

  $('syncRow').addEventListener('click', () => {
    if (openSheet) openSheet.classList.remove('open');
    renderSyncSheet();
    show($('syncSheet'));
  });

  // ---------- Tick ----------
  renderAll();
  Sync.start();
  requestAnimationFrame(() => placeThumb(seg));
  window.addEventListener('resize', () => placeThumb(seg));
  let lastMinute = Math.floor(Date.now() / MIN);
  setInterval(() => {
    const now = Date.now();
    renderHero(now);
    const m = Math.floor(now / MIN);
    if (m !== lastMinute) { lastMinute = m; renderAll(); }
  }, 1000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { state = load(); renderAll(); state.family ? Sync.start() : Sync.stop(); } });

  // ---------- Offline ----------
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
